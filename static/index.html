<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBoardGame - CABO</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>OpenBoardGame - CABO</h1>

    <section class="panel">
      <h2>Connection</h2>
      <div class="row">
        <label>Name</label>
        <input id="nameInput" type="text" placeholder="Your name" />
      </div>
      <div class="row">
        <button id="createBtn">Create Room</button>
      </div>
      <div class="row">
        <label>Room ID</label>
        <input id="roomIdInput" type="text" placeholder="e.g. a1b2c3" />
        <button id="joinBtn">Join Room</button>
      </div>
      <div class="row" id="connectionInfo"></div>
    </section>

    <section class="panel">
      <h2>Room</h2>
      <div class="row">
        <div>Room ID: <span id="roomIdLabel">-</span></div>
        <div>Status: <span id="roomStatus">-</span></div>
      </div>
      <div class="row actions">
        <button id="readyBtn">Toggle Ready</button>
        <button id="startBtn">Start Game</button>
        <button id="addBotBtn">Add Bot</button>
      </div>
      <div id="playersList"></div>
    </section>

    <section class="panel">
      <h2>Game</h2>
      <div class="row">
        <div>Phase: <span id="phaseLabel">-</span></div>
        <div>Round: <span id="roundLabel">-</span></div>
        <div>Current Turn: <span id="turnLabel">-</span></div>
      </div>
      <div class="row">
        <div>Deck: <span id="deckCount">-</span></div>
        <div>Discard Top: <span id="discardTop">-</span></div>
        <div>Last Drawn: <span id="lastDrawn">-</span></div>
      </div>
      <div class="row">
        <div>Cabo Called By: <span id="caboBy">-</span></div>
        <div>Cabo Turns Left: <span id="caboLeft">-</span></div>
      </div>
      <div class="row">
        <div>Pending Choice: <span id="pendingChoice">-</span></div>
      </div>

      <h3>Your Hand</h3>
      <div id="handSlots" class="hand"></div>
      <div class="row">
        <div>Selected Slots: <span id="selectedSlots">-</span></div>
        <button id="clearSelection">Clear</button>
      </div>

      <h3>Actions</h3>
      <div class="row actions">
        <button id="peekBtn">Initial Peek</button>
        <button id="drawDeckBtn">Draw Deck</button>
        <button id="drawDiscardBtn">Draw Discard</button>
        <button id="replaceBtn">Replace Card</button>
        <button id="discardDrawnBtn">Discard Drawn</button>
        <button id="matchBtn">Attempt Match</button>
        <button id="callCaboBtn">Call Cabo</button>
        <button id="choiceBtn">Resolve Choice</button>
      </div>

      <h3>Targets</h3>
      <div class="row">
        <div>Selected Target: <span id="targetSelection">-</span></div>
        <button id="clearTarget">Clear Target</button>
      </div>
      <div id="targetList" class="target-list"></div>

      <h3>Players</h3>
      <div id="gamePlayers"></div>

      <h3>Log</h3>
      <div id="log"></div>
    </section>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
