<template data-game-target="bombBustersHelpModal" data-game-mode="replace"><section id="bombBustersHelpModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="bombBustersHelpModalTitle">
    <div class="modal-content bomb-busters-modal-content">
      <div class="modal-header">
        <h2 id="bombBustersHelpModalTitle">Bomb Busters - Game Rules</h2>
        <button id="bombBustersHelpCloseBtn" type="button">Close</button>
      </div>
      <div id="bombBustersHelpContent" class="modal-body bomb-busters-help-content"></div>
    </div>
  </section></template>
<template data-game-target="bombBustersExplainModal" data-game-mode="replace"><section id="bombBustersExplainModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="bombBustersExplainModalTitle">
    <div class="modal-content bomb-busters-modal-content bomb-busters-explain-content">
      <div class="modal-header">
        <h2 id="bombBustersExplainModalTitle">Control Explanation</h2>
        <button id="bombBustersExplainCloseBtn" type="button">Close</button>
      </div>
      <div id="bombBustersExplainContent" class="modal-body"></div>
    </div>
  </section></template>
<template data-game-target="bombBustersPanel" data-game-mode="contents">
              <div class="bomb-busters-topbar">
                <div class="bomb-busters-title-block" data-bomb-busters-tip="Core Practice uses original practice setups, without shared equipment or the official campaign.">
                  <div class="bomb-busters-subtitle">
                    <span id="bombBustersPresetLabel">Standard Practice</span>
                    <span>· Bomb <span id="bombBustersMissionLabel">1</span></span>
                  </div>
                </div>
                <strong id="bombBustersTurnLabel" class="bomb-busters-turn-label">Waiting…</strong>
              </div>

              <div id="bombBustersStatus" class="bomb-busters-status" role="status" aria-live="polite">Waiting for game state…</div>

              <div class="bomb-busters-instruments">
                <section id="bombBustersDetonator" class="bomb-busters-detonator" data-bomb-busters-explain="detonator" aria-label="Detonator status"></section>
                <section class="bomb-busters-markers" aria-labelledby="bombBustersMarkersHeading">
                  <h3 id="bombBustersMarkersHeading" data-bomb-busters-tip="Public color markers show the yellow and red sorting positions in this bomb, not which player owns them.">Color Markers</h3>
                  <div id="bombBustersMarkers"></div>
                </section>
              </div>

              <section id="bombBustersActionDock" class="bomb-busters-action-dock" aria-labelledby="bombBustersActionsHeading">
                <div class="bomb-busters-section-heading">
                  <h3 id="bombBustersActionsHeading">Your Action</h3>
                  <span id="bombBustersActionMode">Duo Cut</span>
                </div>
                <div id="bombBustersActionSummary" class="bomb-busters-action-summary" role="status" aria-live="polite">Choose one of your 🔵 or 🟡 wires.</div>
                <div id="bombBustersSoloOptions" class="bomb-busters-solo-options"></div>
                <div class="bomb-busters-actions">
                  <button id="bombBustersShareClueBtn" type="button">Share Clue</button>
                  <button id="bombBustersConfirmDuoBtn" type="button">Confirm Duo Cut</button>
                  <button id="bombBustersDetectorBtn" type="button">Use Double Detector</button>
                  <button id="bombBustersConfirmDetectorBtn" type="button">Confirm Detector Cut</button>
                  <button id="bombBustersConfirmSoloBtn" type="button">Confirm Solo Cut</button>
                  <button id="bombBustersResolveBtn" type="button">Confirm Choice</button>
                  <button id="bombBustersSecureRedBtn" type="button">🛡️ Secure Red Wires</button>
                </div>
              </section>

              <div class="bomb-busters-layout">
                <section class="bomb-busters-racks-section" aria-labelledby="bombBustersRacksHeading">
                  <div class="bomb-busters-section-heading">
                    <h3 id="bombBustersRacksHeading" data-bomb-busters-tip="Each rack is sorted separately. Cut wires stay in their original numbered slots.">Team Racks</h3>
                  </div>
                  <div id="bombBustersRacks" class="bomb-busters-racks"></div>
                </section>

                <aside class="bomb-busters-side">
                  <details id="bombBustersIntel" class="bomb-busters-details">
                    <summary>✅ Validation <span id="bombBustersValidationSummary"></span></summary>
                    <div class="bomb-busters-details-body">
                      <div id="bombBustersValidation" class="bomb-busters-validation" data-bomb-busters-explain="validation"></div>
                      <div class="bomb-busters-detector-card" data-bomb-busters-explain="detector">
                        <h3>🔎 Your Double Detector</h3>
                        <div id="bombBustersDetectorStatus">Ready</div>
                      </div>
                    </div>
                  </details>
                  <details id="bombBustersActivityDetails" class="bomb-busters-details">
                    <summary aria-label="Team Activity">Activity <span id="bombBustersActivityCount">0 actions</span></summary>
                    <div class="bomb-busters-details-body">
                      <div id="bombBustersActivity" class="bomb-busters-activity" tabindex="0" aria-label="Team activity">No actions yet.</div>
                    </div>
                  </details>
                </aside>
              </div>

              <section id="bombBustersResult" class="bomb-busters-result hidden" aria-live="polite">
                <div>
                  <span class="bomb-busters-eyebrow">Mission review</span>
                  <h3 id="bombBustersResultTitle">Mission Defused</h3>
                  <p id="bombBustersResultDetail"></p>
                </div>
                <div id="bombBustersReadyList" class="bomb-busters-ready-list"></div>
                <button id="bombBustersContinueBtn" type="button">Next Bomb</button>
              </section>

              <div id="bombBustersWirePopover" class="bomb-busters-wire-popover" role="dialog" aria-modal="false" aria-label="Confirm wire action" aria-hidden="true">
                <p id="bombBustersWirePopoverText">Choose a wire.</p>
                <div class="bomb-busters-wire-popover-actions">
                  <button id="bombBustersWirePopoverConfirmBtn" type="button">Confirm</button>
                  <button id="bombBustersWirePopoverCancelBtn" type="button">Cancel</button>
                </div>
              </div>

              <div id="bombBustersTooltip" class="bomb-busters-tooltip hidden" role="tooltip"></div>
              <div id="bombBustersLiveRegion" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
            </template>
