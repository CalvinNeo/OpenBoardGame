<template data-game-target="trioPanel" data-game-mode="contents">
              <div class="trio-root">
                <div class="trio-status">
                  <span class="trio-chip trio-mode" id="trioMode" data-trio-explain="mode">—</span>
                  <span class="trio-chip trio-goal" id="trioGoal" data-trio-explain="goal">—</span>
                  <span class="trio-chip trio-turn-chip" id="trioTurn" data-trio-explain="turn">—</span>
                </div>

                <div id="trioBanner" class="trio-banner" data-trio-explain="banner"></div>

                <div class="trio-columns">
                  <div class="trio-left">
                    <div class="trio-block">
                      <div class="trio-block-head">
                        <span class="trio-block-title" data-trio-explain="table">Table</span>
                        <span class="trio-block-note" id="trioTableNote"></span>
                      </div>
                      <div id="trioTable" class="trio-table" data-trio-cols="3"></div>

                      <div class="trio-turn" data-trio-explain="reveal">
                        <span class="trio-block-title trio-turn-label">This turn</span>
                        <div id="trioReveal" class="trio-reveal"></div>
                        <span class="trio-turn-note" id="trioRevealNote"></span>
                      </div>
                    </div>
                  </div>

                  <div class="trio-right">
                    <div class="trio-block">
                      <div class="trio-block-head">
                        <span class="trio-block-title" data-trio-explain="players">Players</span>
                        <span class="trio-block-note" id="trioPlayersNote"></span>
                      </div>
                      <div id="trioPlayers" class="trio-players"></div>
                    </div>
                  </div>
                </div>

                <details class="trio-logbox" data-trio-explain="log">
                  <summary>Log</summary>
                  <div id="trioLog" class="trio-log"></div>
                </details>
              </div>
            </template>
