<template data-game-target="goldRushHelpModal" data-game-mode="replace"><section id="goldRushHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content gold-rush-help-modal">
      <div class="modal-header">
        <h2>Gold Rush - Game Rules</h2>
        <button id="goldRushHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body gold-rush-help-content" id="goldRushHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="goldRushExplainModal" data-game-mode="replace"><section id="goldRushExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content gold-rush-explain-modal">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="goldRushExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="goldRushExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="goldRushPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="goldRushPhase">-</span></div>
                <div>Mode: <span id="goldRushMode">-</span></div>
                <div>Current Turn: <span id="goldRushTurn">-</span></div>
              </div>
              <div class="row">
                <div>Deck: <span id="goldRushDeck">-</span></div>
                <div>Winner: <span id="goldRushWinner">-</span></div>
              </div>

              <h3>Your Hand</h3>
              <div id="goldRushHand" class="hand"></div>
              <div class="row">
                <div>Selected Card: <span id="goldRushSelectedCard">-</span></div>
                <button id="goldRushClearSelection">Clear</button>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <button id="goldRushPlayCardBtn">Play Card</button>
                <button id="goldRushDrawCardBtn">Draw Card</button>
                <button id="goldRushInvestYesBtn">Invest</button>
                <button id="goldRushInvestNoBtn">Skip</button>
                <button id="goldRushPlayAgainBtn">Play Again</button>
              </div>

              <h3>Mines</h3>
              <div id="goldRushMines" class="gold-rush-mines"></div>

              <h3>Players</h3>
              <div id="goldRushPlayers"></div>

              <h3>Score Breakdown</h3>
              <div id="goldRushScoreBreakdown"></div>
            </template>
