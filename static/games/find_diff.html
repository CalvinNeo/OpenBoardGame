<template data-game-target="findDiffPanel" data-game-mode="contents">
              <div class="find-diff-status">
                <span class="find-diff-chip find-diff-chip-clock" data-find-diff-explain="clock">⏱️ <b id="findDiffClock">0:00.0</b></span>
                <span class="find-diff-chip" data-find-diff-explain="progress">📷 <b id="findDiffImage">1</b>/<b id="findDiffImages">5</b></span>
                <span class="find-diff-chip" data-find-diff-explain="remaining">🎯 <b id="findDiffRemaining">3</b> left</span>
                <span class="find-diff-chip" data-find-diff-explain="deadline">⏳ <b id="findDiffDeadline">10:00</b></span>
                <span class="find-diff-chip find-diff-chip-scene" id="findDiffScene" data-find-diff-explain="scene">—</span>
                <button type="button" class="find-diff-layout-btn" id="findDiffLayoutBtn" title="Switch picture layout">⬌ Side by side</button>
              </div>

              <div class="find-diff-scores" id="findDiffScores" data-find-diff-explain="scores"></div>

              <div class="find-diff-stage" id="findDiffStage">
                <figure class="find-diff-frame" data-find-diff-explain="picture">
                  <img id="findDiffImageA" alt="Picture A" draggable="false">
                  <div class="find-diff-marks" id="findDiffMarksA"></div>
                  <figcaption>A</figcaption>
                </figure>
                <figure class="find-diff-frame" data-find-diff-explain="picture">
                  <img id="findDiffImageB" alt="Picture B" draggable="false">
                  <div class="find-diff-patches" id="findDiffPatchesB"></div>
                  <div class="find-diff-marks" id="findDiffMarksB"></div>
                  <figcaption>B</figcaption>
                </figure>
              </div>

              <div class="find-diff-hint" id="findDiffHint" data-find-diff-explain="hint"></div>

              <div class="find-diff-result" id="findDiffResult" hidden></div>

              <details class="find-diff-logbox" data-find-diff-explain="log">
                <summary>Log</summary>
                <div id="findDiffLog" class="find-diff-log"></div>
              </details>
            </template>
