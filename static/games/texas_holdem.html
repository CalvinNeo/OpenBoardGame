<template data-game-target="texasHoldemPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="texasPhase">-</span></div>
                <div>Hand: <span id="texasHand">-</span></div>
                <div>Current Turn: <span id="texasTurn">-</span></div>
              </div>
              <div class="row">
                <div>Pot: <span id="texasPot">-</span></div>
                <div>Current Bet: <span id="texasCurrentBet">-</span></div>
                <div>To Call: <span id="texasToCall">-</span></div>
              </div>
              <div class="row">
                <div>Blinds: <span id="texasBlinds">-</span></div>
                <div>Min Bet: <span id="texasMinBet">-</span></div>
                <div>Min Raise To: <span id="texasMinRaiseTo">-</span></div>
                <div>Max: <span id="texasMaxRaiseTo">-</span></div>
              </div>

              <h3>Community Cards</h3>
              <div id="texasCommunityCards" class="texas-cards"></div>

              <h3>Your Hand</h3>
              <div id="texasYourHand" class="texas-cards"></div>

              <h3>Actions</h3>
              <div class="row actions texas-action-row">
                <button id="texasFoldBtn">Fold</button>
                <button id="texasCheckBtn">Check</button>
                <button id="texasCallBtn">Call</button>
                <button id="texasAllInBtn">All-in</button>
              </div>
              <div class="row actions texas-action-row">
                <input id="texasBetInput" type="number" min="1" step="1" placeholder="Bet/Raise to" />
                <button id="texasBetBtn">Bet</button>
                <button id="texasRaiseBtn">Raise</button>
              </div>
              <div class="row actions texas-action-row">
                <button id="texasNextHandBtn">Next Hand</button>
                <button id="texasRebuyBtn">Rebuy</button>
              </div>

              <div id="texasSummary" class="round-notice hidden" aria-hidden="true">
                <div class="round-notice-title">Last Hand</div>
                <div id="texasSummaryBody" class="round-notice-body">-</div>
                <div id="texasSummaryList" class="texas-summary-list"></div>
              </div>

              <h3>Players</h3>
              <div id="texasPlayers" class="texas-players"></div>
            </template>
