<template data-game-target="arkNovaConfigBox" data-game-mode="contents">
  <div class="game-config-title">🗺️ Ark Nova</div>
  <div class="row compact-row">
    <label for="arkNovaMapMode">Zoo maps</label>
    <select id="arkNovaMapMode" aria-describedby="arkNovaMapModeHint">
      <option value="map0">Map 0 for everyone</option>
      <option value="choose">Each player chooses</option>
    </select>
  </div>
  <p id="arkNovaMapModeHint" class="hint">Choose from Map 0 and Maps 1A–6A before selecting your starting hand.</p>
</template>
