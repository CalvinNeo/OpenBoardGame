<template data-game-target="kobayakawaPanel" data-game-mode="contents">
              <div class="kobayakawa-toolbar">
                <h3>🎴 Kobayakawa</h3>
                <div class="kobayakawa-tools">
                  <button id="kobayakawaHelpBtn" type="button">Help</button>
                  <button id="kobayakawaExplainBtn" type="button" aria-pressed="false">Explain</button>
                </div>
              </div>
              <div class="row">
                <div data-kobayakawa-explain="phase">Phase: <span id="kobayakawaPhase">-</span></div>
                <div data-kobayakawa-explain="round">Round: <span id="kobayakawaRound">-</span></div>
                <div data-kobayakawa-explain="turn">Current Turn: <span id="kobayakawaTurn">-</span></div>
              </div>
              <div class="row">
                <div data-kobayakawa-explain="start_player">Start Player: <span id="kobayakawaStartPlayer">-</span></div>
                <div data-kobayakawa-explain="kobayakawa_card">Kobayakawa: <span id="kobayakawaCard">-</span></div>
                <div data-kobayakawa-explain="pot">Pot: <span id="kobayakawaPot">-</span></div>
                <div data-kobayakawa-explain="deck">Deck: <span id="kobayakawaDeck">-</span></div>
              </div>
              <div class="row">
                <div data-kobayakawa-explain="winner">Winner: <span id="kobayakawaWinner">-</span></div>
              </div>
              <div id="kobayakawaRoundNotice" class="round-notice hidden" data-kobayakawa-explain="round_notice">
                <div id="kobayakawaRoundNoticeTitle" class="round-notice-title">Last Round</div>
                <div id="kobayakawaRoundNoticeBody" class="round-notice-body">-</div>
                <div id="kobayakawaRoundNoticeList" class="kobayakawa-summary-list"></div>
              </div>

              <h3>Your Hand</h3>
              <div class="row kobayakawa-hand">
                <div data-kobayakawa-explain="hand">Hand: <span id="kobayakawaHand">-</span></div>
                <div data-kobayakawa-explain="drawn">Drawn: <span id="kobayakawaDrawn">-</span></div>
              </div>

              <h3>Actions</h3>
              <div class="row actions kobayakawa-actions">
                <button id="kobayakawaDrawBtn" data-kobayakawa-explain="draw">Draw</button>
                <button id="kobayakawaReplaceBtn" data-kobayakawa-explain="replace">Replace Kobayakawa</button>
                <button id="kobayakawaKeepDrawnBtn" data-kobayakawa-explain="keep_drawn">Keep Drawn</button>
                <button id="kobayakawaDiscardDrawnBtn" data-kobayakawa-explain="discard_drawn">Discard Drawn</button>
                <button id="kobayakawaFightBtn" data-kobayakawa-explain="fight">Fight (-1)</button>
                <button id="kobayakawaPassBtn" data-kobayakawa-explain="pass">Pass</button>
              </div>

              <h3>Discard Pile</h3>
              <div id="kobayakawaDiscard" class="kobayakawa-discard" data-kobayakawa-explain="discard"></div>

              <h3>Players</h3>
              <div id="kobayakawaPlayers" data-kobayakawa-explain="players"></div>
            </template>
