<template data-game-target="kobayakawaHeaderActions" data-game-mode="contents">
  <button id="kobayakawaHelpBtn" type="button">Help</button>
  <button id="kobayakawaExplainBtn" type="button" aria-pressed="false">Explain</button>
</template>
<template data-game-target="kobayakawaPanel" data-game-mode="contents">
  <div class="kobayakawa-statusbar">
    <strong id="kobayakawaStatus" role="status" aria-live="polite">Waiting for the deal</strong>
    <span data-kobayakawa-explain="round" data-kobayakawa-tip="Round number. Every round uses a freshly shuffled deck.">Round <span id="kobayakawaRound">—</span></span>
    <span id="kobayakawaPhase" data-kobayakawa-explain="phase">—</span>
  </div>
  <div class="kobayakawa-play">
    <section class="kobayakawa-table" aria-label="Public table">
      <div class="kobayakawa-caption"><h3>On the table</h3><span data-kobayakawa-explain="deck" data-kobayakawa-tip="Cards remaining in the draw pile.">Deck <span id="kobayakawaDeck">—</span></span></div>
      <div class="kobayakawa-center">
        <div class="kobayakawa-center-card">
          <span class="kobayakawa-caption">Kobayakawa</span>
          <div class="kobayakawa-number-card kobayakawa-public-card" data-kobayakawa-explain="kobayakawa_card" data-kobayakawa-tip="The smallest hand among fighters adds this card to its strength, not its tokens."><span>🎴</span><strong id="kobayakawaCard">—</strong><small>STRENGTH BONUS</small></div>
          <button id="kobayakawaReplaceBtn" type="button" data-kobayakawa-explain="replace">Replace</button>
        </div>
        <div class="kobayakawa-prizes">
          <div class="kobayakawa-pot" data-kobayakawa-explain="pot" data-kobayakawa-tip="Player bets only. The winner collects the pot plus a separate reserve reward."><span>Bet pot</span><strong>🪙 <span id="kobayakawaPot">0</span></strong></div>
          <div class="kobayakawa-pot" data-kobayakawa-explain="reserve" data-kobayakawa-tip="Public reserve, separate from bets. Each winner takes 1, or the last 2 in the final round."><span>Reserve</span><strong>🪙 <span id="kobayakawaReserve">8</span></strong><small id="kobayakawaReward">Winner +1</small></div>
        </div>
      </div>
      <div class="kobayakawa-caption"><h3>Discard pile</h3><span id="kobayakawaDiscardCount">0 cards</span></div>
      <div id="kobayakawaDiscard" class="kobayakawa-discard" data-kobayakawa-explain="discard" data-kobayakawa-tip="Public discarded cards cannot be drawn again this round."></div>
    </section>
    <section class="kobayakawa-hand-area" aria-label="Your hand">
      <div class="kobayakawa-caption"><h3>Your hand</h3><span id="kobayakawaPrivate">Private</span></div>
      <div class="kobayakawa-hand">
        <div class="kobayakawa-hand-slot">
          <div class="kobayakawa-number-card" data-kobayakawa-explain="hand" data-kobayakawa-tip="Your private hand. Its number determines your showdown strength."><small>HAND</small><strong id="kobayakawaHand">—</strong></div>
          <button id="kobayakawaDiscardDrawnBtn" type="button" class="hidden" data-kobayakawa-explain="discard_drawn">Keep hand</button>
        </div>
        <div id="kobayakawaDrawnSlot" class="kobayakawa-hand-slot hidden">
          <div class="kobayakawa-number-card kobayakawa-drawn-card" data-kobayakawa-explain="drawn" data-kobayakawa-tip="Your newly drawn card. Choose which card to keep."><small>DRAWN</small><strong id="kobayakawaDrawn">—</strong></div>
          <button id="kobayakawaKeepDrawnBtn" type="button" data-kobayakawa-explain="keep_drawn">Keep drawn</button>
        </div>
      </div>
      <button id="kobayakawaDrawBtn" type="button" data-kobayakawa-explain="draw">Draw a card</button>
      <div id="kobayakawaBetting" class="kobayakawa-betting hidden">
        <button id="kobayakawaFightBtn" type="button" data-kobayakawa-explain="fight">Fight · 🪙 −1</button>
        <button id="kobayakawaPassBtn" type="button" data-kobayakawa-explain="pass">Pass</button>
      </div>
      <p id="kobayakawaDecision" class="kobayakawa-decision">Waiting to start</p>
    </section>
  </div>
  <section id="kobayakawaRoundNotice" class="kobayakawa-result hidden" aria-label="Round settlement" aria-live="polite">
    <div class="kobayakawa-caption"><h3 id="kobayakawaRoundNoticeTitle">Round result</h3><span id="kobayakawaResultRound"></span></div>
    <p id="kobayakawaRoundNoticeBody" data-kobayakawa-explain="round_notice"></p>
    <div id="kobayakawaRoundNoticeList" class="kobayakawa-summary-list"></div>
    <div id="kobayakawaReview" class="kobayakawa-review hidden">
      <span id="kobayakawaReady"></span>
      <button id="kobayakawaNextBtn" type="button" data-kobayakawa-explain="next_round">Next Round</button>
    </div>
  </section>
  <div class="kobayakawa-caption"><h3>At the table</h3><span data-kobayakawa-explain="start_player" data-kobayakawa-tip="Both phases start with this player.">First: <span id="kobayakawaStartPlayer">—</span></span></div>
  <div id="kobayakawaPlayers" class="kobayakawa-players"></div>
  <div id="kobayakawaTooltip" class="kobayakawa-tooltip hidden" role="tooltip" popover="manual"></div>
</template>
