<template data-game-target="tucanoPanel" data-game-mode="contents">
              <div class="tucano-header">
                <div>
                  <h2>🌴 Tucano</h2>
                  <div class="tucano-subtitle">A little fruit. A little mischief.</div>
                </div>
                <div class="tucano-header-actions">
                  <button id="tucanoHelpBtn" type="button">Help</button>
                  <button id="tucanoExplainBtn" type="button" aria-pressed="false">Explain</button>
                </div>
              </div>

              <div class="tucano-status-grid">
                <div><span class="tucano-status-label">Phase</span><strong id="tucanoPhase">-</strong></div>
                <div><span class="tucano-status-label">Current turn</span><strong id="tucanoTurn">-</strong></div>
                <div><span class="tucano-status-label">🎴 Deck</span><strong id="tucanoDeck">-</strong></div>
              </div>
              <div id="tucanoWinner" class="tucano-winner hidden" role="status"></div>

              <div id="tucanoNotice" class="tucano-notice hidden" aria-hidden="true" role="status" aria-live="polite">
                <strong id="tucanoNoticeTitle">Your turn</strong>
                <div id="tucanoNoticeBody">-</div>
                <div id="tucanoActions" class="tucano-actions hidden">
                  <button id="tucanoFlipBtn" type="button" class="hidden">🛡️ Protect fruit</button>
                  <button id="tucanoSkipBtn" type="button" class="hidden">Skip</button>
                </div>
                <div id="tucanoSelection" class="tucano-selection hidden"></div>
              </div>

              <section class="tucano-market" aria-labelledby="tucanoMarketTitle">
                <div class="tucano-section-heading">
                  <h3 id="tucanoMarketTitle">🍃 Fruit market</h3>
                  <span>Take one full column</span>
                </div>
                <div id="tucanoColumns" class="tucano-columns"></div>
              </section>

              <section aria-labelledby="tucanoPlayersTitle">
                <div class="tucano-section-heading">
                  <h3 id="tucanoPlayersTitle">🧺 Collections</h3>
                  <span>Tap Scores for details</span>
                </div>
                <div id="tucanoPlayers" class="tucano-players"></div>
              </section>

              <section id="tucanoHelpModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="tucanoHelpTitle">
                <div class="modal-content tucano-modal">
                  <div class="modal-header">
                    <h2 id="tucanoHelpTitle">Tucano Help</h2>
                    <button id="tucanoHelpModalCloseBtn" type="button">Close</button>
                  </div>
                  <div id="tucanoHelpContent" class="modal-body"></div>
                </div>
              </section>

              <section id="tucanoExplainModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="tucanoExplainTitle">
                <div class="modal-content tucano-modal">
                  <div class="modal-header">
                    <h2 id="tucanoExplainTitle">Tucano Explain</h2>
                    <button id="tucanoExplainModalCloseBtn" type="button">Close</button>
                  </div>
                  <div id="tucanoExplainContent" class="modal-body"></div>
                </div>
              </section>
            </template>
