<template data-game-target="pokemonSplendorHelpModal" data-game-mode="replace"><section id="pokemonSplendorHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content pokemon-splendor-help-modal">
      <div class="modal-header">
        <h2>Splendor: Pokemon - Game Rules</h2>
        <button id="pokemonSplendorHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body pokemon-splendor-help-content" id="pokemonSplendorHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="pokemonSplendorExplainModal" data-game-mode="replace"><section id="pokemonSplendorExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content pokemon-splendor-explain-modal">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="pokemonSplendorExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="pokemonSplendorExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="pokemonSplendorTokenModal" data-game-mode="replace"><section id="pokemonSplendorTokenModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content pokemon-splendor-token-modal">
      <div class="modal-header">
        <h2>Take Tokens</h2>
        <button id="pokemonSplendorTokenModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <p id="pokemonSplendorTokenHint" class="pokemon-token-hint" role="status">
          Pick three different colors, or pick the same color twice.
        </p>
        <div class="pokemon-token-section">
          <div class="pokemon-token-section-title">Available</div>
          <div id="pokemonSplendorTokenPool" class="pokemon-token-pool"></div>
        </div>
        <div class="pokemon-token-section">
          <div class="pokemon-token-section-title">Picked</div>
          <div id="pokemonSplendorTokenPicked" class="pokemon-token-picked"></div>
        </div>
        <div id="pokemonSplendorDiscardSelectionModalRow" class="pokemon-token-section hidden">
          <div class="pokemon-token-section-title">Discard Selection</div>
          <div id="pokemonSplendorDiscardSelectionModal" class="splendor-token-selection"></div>
        </div>
        <div id="pokemonSplendorDiscardHintModal" class="splendor-discard-hint hidden"></div>
        <div class="pokemon-token-actions">
          <button id="pokemonSplendorConfirmThreeBtn" type="button">Take 3 Different</button>
          <button id="pokemonSplendorConfirmTwoBtn" type="button">Take 2 Same</button>
        </div>
      </div>
    </div>
  </section></template>
<template data-game-target="pokemonSplendorPanel" data-game-mode="contents">
              <div class="pokemon-splendor-status" aria-label="Game status">
                <div class="pokemon-status-item"><span>Phase</span><strong id="pokemonSplendorPhase">-</strong></div>
                <div class="pokemon-status-item"><span>Current Turn</span><strong id="pokemonSplendorTurn">-</strong></div>
                <div class="pokemon-status-item"><span>Final Round</span><strong id="pokemonSplendorFinalRound">-</strong></div>
                <div class="pokemon-status-item"><span>Kanto Token</span><strong id="pokemonSplendorStart">-</strong></div>
                <div class="pokemon-status-item"><span>Winner</span><strong id="pokemonSplendorWinner">-</strong></div>
              </div>

              <div class="pokemon-splendor-workspace">
                <aside class="pokemon-command-column" aria-label="Your turn controls">
                  <section class="pokemon-supply-panel">
                    <h3 class="pokemon-section-heading">Token Supply</h3>
                    <div id="pokemonSplendorSupply" class="splendor-token-row pokemon-supply"></div>
                  </section>

                  <div id="pokemonSplendorPrompt" class="pokemon-turn-prompt" role="status" aria-live="polite">
                    Waiting for the game state.
                  </div>

                  <section class="pokemon-action-console" aria-label="Turn controls">
                    <div class="pokemon-action-console-title">
                      <span>Current choice</span>
                      <strong>Select a card or take tokens</strong>
                    </div>
                    <div class="pokemon-selection-summary">
                      <div><span>Market</span><strong id="pokemonSplendorSelectedMarket">-</strong></div>
                      <div><span>Reserved</span><strong id="pokemonSplendorSelectedReserved">-</strong></div>
                      <div><span>Evolution base</span><strong id="pokemonSplendorSelectedBase">-</strong></div>
                    </div>
                    <div id="pokemonSplendorDiscardSelectionRow" class="pokemon-discard-row hidden">
                      <span>Discard selection</span>
                      <div id="pokemonSplendorDiscardSelection" class="splendor-token-selection"></div>
                    </div>
                    <div id="pokemonSplendorDiscardHint" class="splendor-discard-hint hidden"></div>

                    <div class="pokemon-actions">
                      <button id="pokemonSplendorTakeTokensBtn" class="pokemon-action-primary" type="button">Take Tokens</button>
                      <button id="pokemonSplendorReserveDeckBtn" type="button">Reserve from Deck</button>
                      <button id="pokemonSplendorBuyMarketBtn" class="pokemon-action-primary" type="button">Catch Selected</button>
                      <button id="pokemonSplendorReserveMarketBtn" type="button">Reserve Selected</button>
                      <button id="pokemonSplendorBuyReservedBtn" class="pokemon-action-primary" type="button">Catch Reserved</button>
                      <button id="pokemonSplendorEvolveBtn" class="pokemon-action-primary" type="button">Evolve</button>
                      <button id="pokemonSplendorSkipEvolveBtn" type="button">Skip Evolution</button>
                      <button id="pokemonSplendorDiscardBtn" class="pokemon-action-primary" type="button">Discard Tokens</button>
                    </div>
                  </section>
                </aside>

                <section class="pokemon-market-column" aria-label="Pokemon market">
                  <h3 class="pokemon-section-heading">Market</h3>
                  <div class="splendor-market pokemon-market">
                    <div class="pokemon-market-specials">
                      <div class="splendor-tier pokemon-tier-section pokemon-tier-legendary">
                        <div class="tier-label">Legendary</div>
                        <div id="pokemonSplendorMarketLegendary" class="splendor-cards"></div>
                      </div>
                      <div class="splendor-tier pokemon-tier-section pokemon-tier-rare">
                        <div class="tier-label">Rare</div>
                        <div id="pokemonSplendorMarketRare" class="splendor-cards"></div>
                      </div>
                    </div>
                    <div class="splendor-tier pokemon-tier-section pokemon-tier-lv3">
                      <div class="tier-label">LV3</div>
                      <div id="pokemonSplendorMarketLv3" class="splendor-cards"></div>
                    </div>
                    <div class="splendor-tier pokemon-tier-section pokemon-tier-lv2">
                      <div class="tier-label">LV2</div>
                      <div id="pokemonSplendorMarketLv2" class="splendor-cards"></div>
                    </div>
                    <div class="splendor-tier pokemon-tier-section pokemon-tier-lv1">
                      <div class="tier-label">LV1</div>
                      <div id="pokemonSplendorMarketLv1" class="splendor-cards"></div>
                    </div>
                  </div>
                </section>
              </div>

              <div class="pokemon-personal-grid">
                <section class="pokemon-personal-section">
                  <h3 class="pokemon-section-heading">Your Reserved</h3>
                  <div id="pokemonSplendorReserved" class="splendor-cards"></div>
                </section>
                <section class="pokemon-personal-section">
                  <h3 class="pokemon-section-heading">Your Captured</h3>
                  <div id="pokemonSplendorCaptured" class="splendor-cards"></div>
                </section>
              </div>

              <section class="pokemon-players-section">
                <h3 class="pokemon-section-heading">Players</h3>
                <div id="pokemonSplendorPlayers"></div>
              </section>
            </template>
