<template data-game-target="dumbQuestionsHelpModal" data-game-mode="replace"><section id="dumbQuestionsHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content dumb-questions-help-modal">
      <div class="modal-header">
        <h2>Dumb Questions Help</h2>
        <button id="dumbQuestionsHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body dumb-questions-help-content" id="dumbQuestionsHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="dumbQuestionsExplainModal" data-game-mode="replace"><section id="dumbQuestionsExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content dumb-questions-explain-modal">
      <div class="modal-header">
        <h2>Dumb Questions Explain</h2>
        <button id="dumbQuestionsExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body" id="dumbQuestionsExplainContent"></div>
    </div>
  </section></template>
<template data-game-target="dumbQuestionsPanel" data-game-mode="contents">
              <div class="dumb-questions-summary-grid">
                <div class="dumb-questions-summary-card">
                  <div class="dumb-questions-summary-label">Phase</div>
                  <div class="dumb-questions-summary-value" id="dumbQuestionsPhase">-</div>
                </div>
                <div class="dumb-questions-summary-card">
                  <div class="dumb-questions-summary-label">Round</div>
                  <div class="dumb-questions-summary-value" id="dumbQuestionsRound">-</div>
                </div>
                <div class="dumb-questions-summary-card">
                  <div class="dumb-questions-summary-label">Guesser</div>
                  <div class="dumb-questions-summary-value" id="dumbQuestionsGuesser">-</div>
                </div>
                <div class="dumb-questions-summary-card">
                  <div class="dumb-questions-summary-label">Category</div>
                  <div class="dumb-questions-summary-value" id="dumbQuestionsCategory">-</div>
                </div>
              </div>
              <div id="dumbQuestionsStatusCard" class="round-notice dumb-questions-status-card">
                <div class="round-notice-title">Status</div>
                <div id="dumbQuestionsStatusBody" class="round-notice-body">-</div>
              </div>
              <div class="dumb-questions-grid">
                <div class="dumb-questions-column dumb-questions-column--main">
                  <div id="dumbQuestionsPromptCard" class="dumb-questions-card">
                    <div class="dumb-questions-card-title">🎯 Prompt</div>
                    <div id="dumbQuestionsPrompt" class="dumb-questions-prompt">-</div>
                  </div>
                  <div id="dumbQuestionsCategoryCard" class="dumb-questions-card">
                    <div class="dumb-questions-card-title">🗂️ Choose Category</div>
                    <div id="dumbQuestionsCategories" class="dumb-questions-categories"></div>
                  </div>
                  <div id="dumbQuestionsAnswerCard" class="dumb-questions-card">
                    <div class="dumb-questions-card-title">✍️ Your Answer</div>
                    <div class="dumb-questions-answer-row">
                      <textarea id="dumbQuestionsAnswerInput" rows="3" placeholder="Type one honest answer..."></textarea>
                      <button id="dumbQuestionsSubmitAnswerBtn" type="button">Submit Answer</button>
                    </div>
                  </div>
                  <div id="dumbQuestionsAnswersCard" class="dumb-questions-card">
                    <div class="dumb-questions-card-title">🧠 Answers</div>
                    <div id="dumbQuestionsAnswers" class="dumb-questions-answers"></div>
                  </div>
                  <div id="dumbQuestionsPendingCard" class="dumb-questions-card">
                    <div class="dumb-questions-card-title">🃏 Current Card</div>
                    <div id="dumbQuestionsPendingBody" class="dumb-questions-pending-body">Reveal the next card to begin ranking.</div>
                    <div class="row actions">
                      <button id="dumbQuestionsRevealBtn" type="button">Reveal Next Card</button>
                    </div>
                  </div>
                </div>
                <div class="dumb-questions-column">
                  <div id="dumbQuestionsBoardCard" class="dumb-questions-card">
                    <div class="dumb-questions-card-title">📊 Score Board</div>
                    <div id="dumbQuestionsBoard" class="dumb-questions-board"></div>
                  </div>
                  <div id="dumbQuestionsSummaryCard" class="dumb-questions-card hidden">
                    <div class="dumb-questions-card-title">🏁 Round Summary</div>
                    <div id="dumbQuestionsSummaryBody" class="dumb-questions-summary-body">-</div>
                  </div>
                  <div class="dumb-questions-card">
                    <div class="dumb-questions-card-title">👥 Players</div>
                    <div id="dumbQuestionsPlayers" class="dumb-questions-players"></div>
                  </div>
                  <div class="row actions">
                    <button id="dumbQuestionsFinishBtn" type="button">Score Round</button>
                    <button id="dumbQuestionsContinueBtn" type="button">Continue</button>
                    <button id="dumbQuestionsPlayAgainBtn" type="button">Play Again</button>
                  </div>
                </div>
              </div>
            </template>
