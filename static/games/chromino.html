<template data-game-target="chrominoPanel" data-game-mode="contents">
  <div id="chrominoPlayers" class="chromino-players" aria-label="Players"></div>
  <div id="chrominoResult" class="chromino-result hidden" role="status"></div>
  <div class="chromino-layout">
    <section class="chromino-play-area" aria-label="Chromino board">
      <div class="chromino-board-toolbar">
        <div id="chrominoTurn" class="chromino-turn" aria-live="polite">Waiting to start</div>
        <div class="chromino-tools chromino-placement-tools"><button id="chrominoRotate" type="button" data-chromino-explain="rotate" disabled>↻ Rotate</button><button id="chrominoConfirm" class="chromino-primary" type="button" data-chromino-explain="confirm" disabled>Confirm</button></div>
      </div>
      <svg id="chrominoBoard" class="chromino-board" viewBox="-240 -180 480 360" role="group" aria-label="Chromino board. Drag to pan; choose a tile and a highlighted centre to preview.">
        <defs><pattern id="chrominoGrid" width="40" height="40" patternUnits="userSpaceOnUse" x="-20" y="-20"><path d="M40 0H0V40" fill="none" stroke="#c2c8bd" stroke-width=".7" opacity=".6" /></pattern></defs>
        <rect class="chromino-board-background" x="-100000" y="-100000" width="200000" height="200000" fill="url(#chrominoGrid)" />
        <g id="chrominoPieces"></g><g id="chrominoTargets"></g><g id="chrominoPreview" pointer-events="none"></g>
      </svg>
      <div class="chromino-confirm-bar">
        <span id="chrominoSelection" role="status">Choose a tile.</span>
        <div class="chromino-tools chromino-zoom-tools"><button id="chrominoZoomOut" type="button" aria-label="Zoom out" data-chromino-explain="zoom_out">−</button><button id="chrominoFit" type="button" data-chromino-explain="fit">Fit</button><button id="chrominoZoomIn" type="button" aria-label="Zoom in" data-chromino-explain="zoom_in">+</button></div>
      </div>
    </section>
    <aside class="chromino-rack-area">
      <div class="chromino-rack-heading"><h3 id="chrominoHandTitle">Your tiles</h3><span id="chrominoBag" tabindex="0" data-chromino-tip="Tiles left in the bag. Draw one only when none of your current tiles can be placed."></span></div>
      <div id="chrominoHand" class="chromino-hand" aria-label="Your tiles"></div>
      <div class="chromino-draw-bar"><button id="chrominoDraw" type="button" data-chromino-explain="draw" disabled>Draw</button><button id="chrominoKeep" type="button" class="hidden" data-chromino-explain="keep">Keep &amp; Pass</button><button id="chrominoPass" type="button" class="hidden" data-chromino-explain="pass">Pass</button></div>
      <div id="chrominoLegend" class="chromino-legend" aria-label="Colour symbols"></div>
      <details class="chromino-history"><summary>Move history</summary><ol id="chrominoLog" aria-label="Move history"></ol></details>
    </aside>
  </div>
  <div id="chrominoTooltip" class="chromino-tooltip hidden" role="tooltip"></div>
</template>
