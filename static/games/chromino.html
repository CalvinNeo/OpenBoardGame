<template data-game-target="chrominoPanel" data-game-mode="contents">
  <div class="chromino-topline">
    <span class="chromino-edition">COLOUR · CONNECT · COMPLETE</span>
    <div class="chromino-tools"><button id="chrominoHelp" type="button">Help</button><button id="chrominoExplainBtn" type="button" aria-pressed="false">Explain</button></div>
  </div>
  <div id="chrominoPlayers" class="chromino-players" aria-label="Players"></div>
  <div id="chrominoResult" class="chromino-result hidden" role="status"></div>
  <div class="chromino-layout">
    <section class="chromino-play-area" aria-label="Chromino board">
      <div class="chromino-board-toolbar">
        <div id="chrominoTurn" class="chromino-turn" aria-live="polite">Waiting to start</div>
        <div class="chromino-tools"><button id="chrominoZoomOut" type="button" aria-label="Zoom out" data-chromino-explain="Zoom out to see more of the board.">−</button><button id="chrominoFit" type="button" data-chromino-explain="Fit the whole board and the selected tile's legal destinations into the visible area.">Fit</button><button id="chrominoZoomIn" type="button" aria-label="Zoom in" data-chromino-explain="Zoom in to inspect the coloured squares. Drag the board to pan.">+</button></div>
      </div>
      <svg id="chrominoBoard" class="chromino-board" viewBox="-240 -180 480 360" role="group" aria-label="Chromino board. Drag to pan; choose a tile and a highlighted centre to preview.">
        <defs><pattern id="chrominoGrid" width="40" height="40" patternUnits="userSpaceOnUse" x="-20" y="-20"><path d="M40 0H0V40" fill="none" stroke="#c2c8bd" stroke-width=".7" opacity=".6" /></pattern></defs>
        <rect class="chromino-board-background" x="-100000" y="-100000" width="200000" height="200000" fill="url(#chrominoGrid)" />
        <g id="chrominoPieces"></g><g id="chrominoTargets"></g><g id="chrominoPreview" pointer-events="none"></g>
      </svg>
      <div class="chromino-confirm-bar">
        <span id="chrominoSelection" role="status">Choose a tile.</span>
        <div class="chromino-tools"><button id="chrominoRotate" type="button" data-chromino-explain="Rotate the selected tile clockwise by 90 degrees around its middle square. Its middle stays in the same place. You can also press R." disabled>↻ Rotate</button><button id="chrominoConfirm" class="chromino-primary" type="button" data-chromino-explain="Place the previewed tile. First select a tile, then a highlighted centre on the board. No move is sent until you confirm." disabled>Confirm</button></div>
      </div>
    </section>
    <aside class="chromino-rack-area">
      <div class="chromino-rack-heading"><h3 id="chrominoHandTitle">Your tiles</h3><span id="chrominoBag" tabindex="0" data-chromino-tip="Tiles left in the bag. Draw one only when none of your current tiles can be placed."></span></div>
      <div id="chrominoHand" class="chromino-hand" aria-label="Your tiles"></div>
      <div class="chromino-draw-bar"><span id="chrominoHint" aria-live="polite"></span><button id="chrominoDraw" type="button" data-chromino-explain="Draw one tile only if none of your current tiles can be placed. A last Chameleon (★) cannot be played, so you must draw. A playable draw can be placed or kept; an unplayable draw is kept automatically." disabled>Draw</button><button id="chrominoKeep" type="button" class="hidden" data-chromino-explain="Keep the tile you just drew and end your turn, even if it could be placed. You cannot play an older tile after drawing.">Keep &amp; Pass</button><button id="chrominoPass" type="button" class="hidden" data-chromino-explain="Pass only when the bag is empty and you have no legal placement. You cannot pass voluntarily while a tile can be played.">Pass</button></div>
      <div id="chrominoLegend" class="chromino-legend" aria-label="Colour symbols"></div>
      <details class="chromino-history"><summary>Move history</summary><ol id="chrominoLog" aria-label="Move history"></ol></details>
    </aside>
  </div>
  <div id="chrominoTooltip" class="chromino-tooltip hidden" role="tooltip"></div>
  <dialog id="chrominoDialog" class="chromino-dialog" aria-labelledby="chrominoDialogTitle"><div class="chromino-dialog-heading"><h2 id="chrominoDialogTitle">Chromino</h2><button id="chrominoDialogClose" type="button">Close</button></div><div id="chrominoDialogBody"></div></dialog>
</template>
