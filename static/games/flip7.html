<template data-game-target="flip7Panel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="flip7Phase">-</span></div>
                <div>Round: <span id="flip7Round">-</span></div>
                <div>Current Turn: <span id="flip7Turn">-</span></div>
              </div>
              <div class="row">
                <div>Deck: <span id="flip7Deck">-</span></div>
                <div>Discard: <span id="flip7Discard">-</span></div>
                <div>Target Score: <span id="flip7TargetScore">-</span></div>
              </div>
              <div class="row">
                <div>Pending Action: <span id="flip7Pending">-</span></div>
                <div>flip7flash Winner: <span id="flip7FlipWinner">-</span></div>
              </div>

              <h3>Actions</h3>
              <div id="flip7PlayerActionStash" class="hidden">
                <button id="flip7FlipBtn">Flip</button>
                <button id="flip7StayBtn">Stay</button>
              </div>

              <h3>Players</h3>
              <div id="flip7Players"></div>

              <h3>Last Round</h3>
              <div id="flip7LastRound"></div>

            </template>
