<template data-game-target="raHelpModal" data-game-mode="replace"><section id="raHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ra Help</h2>
        <button id="raHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body" id="raHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="raExplainModal" data-game-mode="replace"><section id="raExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ra Explain</h2>
        <button id="raExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body" id="raExplainContent"></div>
    </div>
  </section></template>
<template data-game-target="raPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="raPhase">-</span></div>
                <div>Epoch: <span id="raEpoch">-</span></div>
                <div>Current Turn: <span id="raTurn">-</span></div>
                <div>Bag: <span id="raBag">-</span></div>
              </div>
              <div class="row">
                <div>Center Sun: <span id="raCenterDisk">-</span></div>
                <div>Ra Track: <span id="raTrackCount">-</span></div>
                <div>Auction: <span id="raAuctionCount">-</span></div>
                <div>Winner: <span id="raWinner">-</span></div>
              </div>
              <div id="raEpochNotice" class="round-notice hidden" aria-hidden="true">
                <div id="raEpochNoticeTitle" class="round-notice-title">Epoch Scoring</div>
                <div id="raEpochNoticeBody" class="round-notice-body">-</div>
                <div id="raEpochNoticeList" class="ra-score-list"></div>
              </div>

              <div class="ra-layout">
                <section class="ra-board">
                  <h3>Board</h3>
                  <div class="ra-track-row">
                    <div>
                      <div class="ra-section-label">Ra Track ☀️</div>
                      <div id="raTrack" class="ra-track"></div>
                    </div>
                    <div>
                      <div class="ra-section-label">Auction Track 🏺</div>
                      <div id="raAuctionTrack" class="ra-auction-track"></div>
                    </div>
                  </div>
                  <div id="raAuctionBox" class="ra-auction-box hidden" aria-hidden="true">
                    <div id="raAuctionInfo" class="ra-auction-info">-</div>
                    <div id="raBidButtons" class="ra-bid-buttons"></div>
                  </div>
                  <div id="raDisasterBox" class="ra-auction-box hidden" aria-hidden="true">
                    <div id="raDisasterInfo" class="ra-auction-info">-</div>
                    <div id="raDisasterChoices" class="ra-disaster-choices"></div>
                    <button id="raResolveDisasterBtn" type="button">Resolve Disaster</button>
                  </div>
                  <h3>Actions</h3>
                  <div class="row actions ra-actions">
                    <button id="raDrawBtn" type="button">Draw Tile</button>
                    <button id="raInvokeBtn" type="button">Invoke Ra</button>
                    <button id="raPlayGodBtn" type="button">Play God</button>
                    <button id="raPassBtn" type="button">Pass</button>
                    <button id="raNextRoundBtn" type="button">Next Round</button>
                  </div>
                  <div id="raSelectionLabel" class="hint">Selected: -</div>
                </section>

                <section class="ra-side">
                  <h3>Players</h3>
                  <div id="raPlayers" class="ra-players"></div>
                </section>
              </div>
            </template>
