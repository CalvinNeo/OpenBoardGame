<template data-game-target="raHelpModal" data-game-mode="replace"><section id="raHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ra Help</h2>
        <button id="raHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body" id="raHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="raExplainModal" data-game-mode="replace"><section id="raExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ra Explain</h2>
        <button id="raExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body" id="raExplainContent"></div>
    </div>
  </section></template>
<template data-game-target="raPanel" data-game-mode="contents">
              <div class="ra-status" id="raStatus">
                <span class="ra-pill" id="raTurnPill" data-ra-tip="Epoch: the game runs 3 epochs. Each epoch ends when the Ra track fills or every sun disk is spent.">Epoch <b id="raEpoch">-</b>/3</span>
                <span class="ra-pill" id="raPhasePill" data-ra-tip="Phase: whose decision the game is waiting for.">Phase <b id="raPhase">-</b></span>
                <span class="ra-pill" id="raTurnNamePill" data-ra-tip="Current Turn: the player who acts now.">Turn <b id="raTurn">-</b></span>
                <span class="ra-pill" data-ra-tip="Bag: tiles left to draw.">Bag <b id="raBag">-</b></span>
                <span class="ra-pill" data-ra-tip="Center Sun: the disk on the board. An auction winner swaps it with the disk they bid and takes it back spent.">Center ☀️<b id="raCenterDisk">-</b></span>
                <span class="ra-pill" data-ra-tip="Ra Track: filled slots out of the epoch limit. Filling it ends the epoch at once.">Ra <b id="raTrackCount">-</b></span>
                <span class="ra-pill" data-ra-tip="Auction Track: tiles on offer. Drawing is blocked while all 8 slots are full.">Auction <b id="raAuctionCount">-</b></span>
              </div>

              <div id="raEpochNotice" class="ra-notice hidden" aria-hidden="true">
                <div class="ra-notice-head">
                  <span id="raEpochNoticeTitle" class="ra-notice-title">Epoch Scoring</span>
                  <span id="raEpochNoticeBody" class="ra-notice-body">-</span>
                </div>
                <div id="raEpochNoticeList" class="ra-score-list"></div>
                <div class="ra-notice-foot">
                  <span id="raReadyState" class="ra-ready-state">-</span>
                  <button id="raNextRoundBtn" type="button" data-ra-explain="raNextRoundBtn">Next Round</button>
                </div>
              </div>

              <div class="ra-layout">
                <section class="ra-board">
                  <div class="ra-track-block">
                    <div class="ra-block-head">
                      <span class="ra-block-title">Ra Track ☀️</span>
                      <span class="ra-block-meta" id="raTrackMeta">-</span>
                    </div>
                    <div id="raTrack" class="ra-track" data-ra-explain="raTrack"></div>
                  </div>

                  <div class="ra-track-block">
                    <div class="ra-block-head">
                      <span class="ra-block-title">Auction Track 🏺</span>
                      <span class="ra-block-meta" id="raAuctionMeta">-</span>
                    </div>
                    <div id="raAuctionTrack" class="ra-auction-track" data-ra-explain="auctionTrack"></div>
                    <div id="raGodBar" class="ra-god-bar hidden" aria-hidden="true">
                      <span id="raGodBarText" class="ra-god-bar-text">-</span>
                      <span class="ra-god-bar-actions">
                        <button id="raPlayGodBtn" type="button" data-ra-explain="raPlayGodBtn">Play God</button>
                        <button id="raGodCancelBtn" type="button" data-ra-explain="raGodCancelBtn">Cancel</button>
                      </span>
                    </div>
                  </div>

                  <div id="raAuctionBox" class="ra-panel-box hidden" aria-hidden="true">
                    <div class="ra-panel-box-head">
                      <span id="raAuctionTitle" class="ra-panel-box-title">Auction</span>
                      <span id="raAuctionBid" class="ra-panel-box-meta">-</span>
                    </div>
                    <div id="raAuctionOrder" class="ra-bid-order"></div>
                    <div class="ra-bid-row">
                      <span class="ra-bid-label">Your disks</span>
                      <div id="raBidButtons" class="ra-bid-buttons"></div>
                      <button id="raPassBtn" type="button" data-ra-explain="raPassBtn">Pass</button>
                    </div>
                  </div>

                  <div id="raDisasterBox" class="ra-panel-box ra-panel-box-alert hidden" aria-hidden="true">
                    <div class="ra-panel-box-head">
                      <span class="ra-panel-box-title">Disaster ⚠️</span>
                      <span id="raDisasterMeta" class="ra-panel-box-meta">-</span>
                    </div>
                    <div id="raDisasterInfo" class="ra-disaster-info"></div>
                    <div id="raDisasterChoices" class="ra-disaster-choices"></div>
                    <div class="ra-disaster-foot">
                      <button id="raResolveDisasterBtn" type="button" data-ra-explain="raResolveDisasterBtn">Resolve Disaster</button>
                    </div>
                  </div>

                  <div id="raActionBar" class="ra-action-bar">
                    <button id="raDrawBtn" type="button" data-ra-explain="raDrawBtn">Draw Tile</button>
                    <button id="raInvokeBtn" type="button" data-ra-explain="raInvokeBtn">Invoke Ra ☀️</button>
                  </div>
                </section>

                <section class="ra-side">
                  <div class="ra-block-head">
                    <span class="ra-block-title">Players</span>
                    <span class="ra-block-meta" id="raPlayersMeta">-</span>
                  </div>
                  <div id="raPlayers" class="ra-players"></div>
                </section>
              </div>
            </template>
