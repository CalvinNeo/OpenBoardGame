<template data-game-target="cheatyMagesHeaderActions" data-game-mode="contents">
    <button id="cheatyMagesHelpBtn" type="button">Help</button>
    <button id="cheatyMagesExplainBtn" type="button" aria-pressed="false">Explain</button>
</template>
<template data-game-target="cheatyMagesPanel" data-game-mode="contents">
    <div class="cm-loading" role="status">Loading the arena…</div>
    <dialog id="cheatyMagesDialog" class="cm-dialog" aria-labelledby="cheatyMagesDialogTitle">
        <div class="cm-dialog-heading"><h2 id="cheatyMagesDialogTitle">Help</h2><button type="button">Close</button></div>
        <div class="cm-dialog-body"></div>
    </dialog>
    <div id="cheatyMagesTooltip" class="cm-tooltip" role="tooltip" hidden></div>
</template>
