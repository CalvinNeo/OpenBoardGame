<template data-game-target="manilaHelpModal" data-game-mode="replace">
  <dialog id="manilaHelpModal" class="manila-dialog" aria-labelledby="manilaHelpTitle">
    <header class="manila-dialog-header">
      <h2 id="manilaHelpTitle">Manila · Game Rules</h2>
      <button id="manilaHelpClose" type="button">Close</button>
    </header>
    <div id="manilaHelpBody" class="manila-dialog-body"></div>
  </dialog>
</template>
<template data-game-target="manilaExplainModal" data-game-mode="replace">
  <dialog id="manilaExplainModal" class="manila-dialog manila-explain-dialog" aria-labelledby="manilaExplainTitle">
    <header class="manila-dialog-header">
      <h2 id="manilaExplainTitle">Explain</h2>
      <button id="manilaExplainClose" type="button">Close</button>
    </header>
    <div id="manilaExplainBody" class="manila-dialog-body"></div>
  </dialog>
</template>
<template data-game-target="manilaPanel" data-game-mode="contents">
  <header class="manila-voyage-header">
    <div class="manila-round-heading">
      <span class="manila-eyebrow">PORT OF MANILA</span>
      <strong id="manilaRoundLabel">等待启航</strong>
    </div>
    <ol id="manilaStages" class="manila-stages" aria-label="Voyage progress"></ol>
  </header>
  <div id="manilaMarket" class="manila-market" aria-label="Cargo market"></div>
  <div class="manila-turnbar">
    <div class="manila-turn-copy">
      <strong id="manilaTurn" aria-live="polite">Waiting for game</strong>
      <span id="manilaActivity" class="manila-activity"></span>
    </div>
    <div id="manilaWallet" class="manila-wallet" aria-label="Your resources"></div>
  </div>
  <p id="manilaError" class="manila-error hidden" role="alert"></p>
  <section id="manilaReview" class="manila-review hidden" aria-label="Voyage results"></section>
  <div class="manila-play-area">
    <section class="manila-waterfront" aria-labelledby="manilaSeaTitle">
      <div class="manila-section-heading">
        <h3 id="manilaSeaTitle">⛵ 航道</h3>
        <span class="manila-caption" data-manila-explain="voyage" data-manila-tip="驶过 13 格即入港；正好停在 13 格可能遇上海盗。" tabindex="0">出海 0 → 13 港口</span>
      </div>
      <div id="manilaBoats" class="manila-sea"></div>
    </section>
    <section id="manilaActionPanel" class="manila-action-panel" aria-label="Current action">
      <div id="manilaActionBody"></div>
      <details id="manilaFinance" class="manila-finance hidden">
        <summary data-manila-explain="pledge">🏦 抵押股票 <span id="manilaDebt"></span></summary>
        <div id="manilaFinanceBody" class="manila-finance-body"></div>
      </details>
    </section>
    <section class="manila-facilities" aria-labelledby="manilaFacilitiesTitle">
      <div class="manila-section-heading">
        <h3 id="manilaFacilitiesTitle">港湾投资</h3>
        <span id="manilaFacilitiesResources" class="manila-caption" data-manila-explain="cash" tabindex="0">入场费 / 收益</span>
      </div>
      <div id="manilaHarborContext" class="manila-harbor-context" aria-label="Ship positions for harbor investments"></div>
      <div id="manilaBoard" class="manila-board"></div>
    </section>
  </div>
  <details id="manilaPlayersDetails" class="manila-table-details">
    <summary>Players <span id="manilaPlayerCount"></span></summary>
    <div id="manilaPlayers" class="manila-players"></div>
  </details>
  <div id="manilaTooltip" class="manila-tooltip hidden" role="tooltip"></div>
</template>
