<template data-game-target="patchworkHelpModal" data-game-mode="replace">
    <dialog id="patchworkHelpModal" class="patchwork-dialog" aria-labelledby="patchworkHelpTitle">
        <div class="patchwork-dialog-heading"><h2 id="patchworkHelpTitle">Patchwork · Help</h2><button id="patchworkHelpClose" type="button">Close</button></div>
        <div id="patchworkHelpContent"></div>
    </dialog>
</template>
<template data-game-target="patchworkExplainModal" data-game-mode="replace">
    <dialog id="patchworkExplainModal" class="patchwork-dialog" aria-labelledby="patchworkExplainTitle">
        <div class="patchwork-dialog-heading"><h2 id="patchworkExplainTitle">Explain</h2><button id="patchworkExplainClose" type="button">Close</button></div>
        <div id="patchworkExplainContent"></div>
    </dialog>
</template>
<template data-game-target="patchworkQuiltModal" data-game-mode="replace">
    <dialog id="patchworkQuiltModal" class="patchwork-dialog" aria-labelledby="patchworkQuiltModalTitle">
        <div class="patchwork-dialog-heading"><h2 id="patchworkQuiltModalTitle">Player Quilt</h2><button id="patchworkQuiltClose" type="button">Close</button></div>
        <div id="patchworkQuiltModalMeta" class="patchwork-quilt-meta"></div>
        <div id="patchworkQuiltModalBoard" class="patchwork-board"></div>
    </dialog>
</template>
<template data-game-target="patchworkPanel" data-game-mode="contents">
    <div class="patchwork-status-bar">
        <strong id="patchworkTurn" role="status"></strong>
        <div id="patchworkWallet" class="patchwork-wallet"></div>
    </div>
    <div id="patchworkError" class="patchwork-error" role="alert" hidden></div>
    <div id="patchworkNotice" class="patchwork-notice" role="status" hidden></div>
    <div class="patchwork-layout">
        <section class="patchwork-market-panel" aria-labelledby="patchworkMarketTitle">
            <div class="patchwork-section-heading">
                <h3 id="patchworkMarketTitle">布块市场 <small>任选其一</small></h3>
                <button id="patchworkAdvanceBtn" type="button" data-patchwork-explain="advance">⏩ 前进 <span id="patchworkAdvanceGain"></span></button>
            </div>
            <div id="patchworkMarket" class="patchwork-market" aria-label="Available patches"></div>
        </section>
        <section class="patchwork-quilt-panel" aria-labelledby="patchworkQuiltTitle">
            <div class="patchwork-section-heading">
                <h3 id="patchworkQuiltTitle">我的拼布</h3>
                <div id="patchworkTransformActions" class="patchwork-transform-actions">
                    <button id="patchworkRotateBtn" type="button" data-patchwork-explain="rotate" aria-label="Rotate patch clockwise">↻ Rotate</button>
                    <button id="patchworkFlipBtn" type="button" data-patchwork-explain="flip" aria-label="Flip patch horizontally">⇆ Flip</button>
                </div>
            </div>
            <div id="patchworkYourBoard" class="patchwork-board" data-patchwork-explain="quilt"></div>
            <div id="patchworkSelectionHint" class="patchwork-hint" role="status"></div>
            <div id="patchworkPlacementActions" class="patchwork-placement-actions" hidden>
                <div id="patchworkPreview" class="patchwork-preview" data-patchwork-explain="quilt"></div>
                <div id="patchworkPlacementStatus" class="patchwork-placement-status" role="status"></div>
                <button id="patchworkConfirmBuyBtn" class="patchwork-primary" type="button" data-patchwork-explain="confirm">Confirm</button>
            </div>
        </section>
        <aside class="patchwork-side-column">
            <section aria-labelledby="patchworkPlayersTitle">
                <h3 id="patchworkPlayersTitle">双方进度</h3>
                <div id="patchworkPlayers" class="patchwork-players"></div>
                <div id="patchworkRewards" class="patchwork-rewards"></div>
                <div id="patchworkActivity" class="patchwork-activity" role="status"></div>
            </section>
            <details id="patchworkTimeDetails" class="patchwork-details">
                <summary data-patchwork-explain="track">⏳ 时间轨道 <span id="patchworkTrackProgress"></span></summary>
                <div id="patchworkTrack" class="patchwork-track" aria-label="Time track"></div>
                <p class="patchwork-track-legend">🔘 纽扣收入 · 🟫 皮革补丁</p>
            </details>
            <details id="patchworkUpcomingDetails" class="patchwork-details">
                <summary data-patchwork-explain="market">后续布块 <span id="patchworkUpcomingCount"></span></summary>
                <div id="patchworkUpcomingMarket" class="patchwork-upcoming-market" tabindex="0" aria-label="Upcoming patch order"></div>
            </details>
        </aside>
    </div>
    <div id="patchworkTooltip" class="patchwork-tooltip" role="tooltip" hidden></div>
</template>
