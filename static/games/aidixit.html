<template data-game-target="aidixitZoomModal" data-game-mode="replace"><section id="aidixitZoomModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content aidixit-zoom-modal">
      <div class="modal-header">
        <h2>Card Detail</h2>
        <button id="aidixitZoomCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <img id="aidixitZoomImage" alt="Card detail" />
      </div>
    </div>
  </section></template>
<template data-game-target="aidixitPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="aidixitPhase">-</span></div>
                <div>Round: <span id="aidixitRound">-</span></div>
                <div>Storyteller: <span id="aidixitStoryteller">-</span></div>
              </div>
              <div class="row">
                <div>Clue: <span id="aidixitClue">-</span></div>
                <div>Target: <span id="aidixitTargetScore">-</span></div>
                <div>Deck: <span id="aidixitDeckCount">-</span></div>
                <div>Discard: <span id="aidixitDiscardCount">-</span></div>
              </div>
              <div class="row">
                <div>Submitted: <span id="aidixitSubmitted">-</span></div>
                <div>Voted: <span id="aidixitVoted">-</span></div>
                <div>Winner: <span id="aidixitWinner">-</span></div>
              </div>

              <div class="row actions">
                <label for="aidixitClueInput">Your Clue</label>
                <input id="aidixitClueInput" type="text" placeholder="Enter clue" />
                <button id="aidixitSubmitStoryBtn">Submit Story</button>
                <button id="aidixitSubmitCardBtn">Submit Card</button>
                <button id="aidixitSubmitVoteBtn">Vote</button>
              </div>

              <h3>Your Hand</h3>
              <div id="aidixitHand" class="aidixit-hand"></div>

              <h3>Pool</h3>
              <div id="aidixitPool" class="aidixit-pool"></div>

              <div id="aidixitRoundNotice" class="round-notice hidden">
                <div class="round-notice-title">Last Round</div>
                <div id="aidixitRoundNoticeBody" class="round-notice-body">-</div>
                <div id="aidixitRoundNoticeCards" class="aidixit-round-cards"></div>
              </div>

              <h3>Players</h3>
              <div id="aidixitPlayers"></div>
            </template>
