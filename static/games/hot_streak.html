<template data-game-target="hotStreakPanel" data-game-mode="contents">
  <div class="hot-streak-status" role="status" aria-label="Race status">
    <strong id="hotStreakRaceLabel" data-hot-streak-explain="race" data-hot-streak-tip="race">Race 1 of 3</strong>
    <span id="hotStreakPhaseLabel" class="hot-streak-phase" data-hot-streak-explain="phase" data-hot-streak-tip="phase">Betting</span>
    <strong id="hotStreakBalance" data-hot-streak-explain="players" data-hot-streak-tip="" data-hot-streak-tip-text="Your cash (💵). Most cash after three races wins.">💵 10</strong>
    <span id="hotStreakTurnLabel" class="hot-streak-turn" data-hot-streak-explain="turn" data-hot-streak-tip="turn">Choose a ticket</span>
  </div>

  <div class="hot-streak-layout">
    <section id="hotStreakTicketSection" class="hot-streak-section hot-streak-ticket-panel" aria-labelledby="hotStreakTicketTitle">
      <div class="hot-streak-section-head">
        <h3 id="hotStreakTicketTitle" data-hot-streak-explain="betting">🎟️ Place your bets</h3>
        <span id="hotStreakDraftProgress" class="hot-streak-mini-status">0/0</span>
      </div>
      <p id="hotStreakTicketHint" class="hot-streak-hint">Choose a ticket, then Safe or Risky.</p>
      <div class="hot-streak-ticket-stage">
        <div id="hotStreakTickets" class="hot-streak-ticket-grid" aria-label="Racer ticket stacks"></div>
        <div id="hotStreakTicketSideBet" class="hot-streak-side-brief" data-hot-streak-explain="side"></div>
        <div id="hotStreakSideTickets" class="hot-streak-ticket-grid" aria-label="Side bet ticket stacks"></div>
        <div id="hotStreakTicketMask" class="hot-streak-ticket-confirm" role="group" aria-labelledby="hotStreakConfirmTitle" hidden>
          <div class="hot-streak-section-head">
            <strong id="hotStreakConfirmTitle">Confirm ticket</strong>
            <button id="hotStreakConfirmCancel" class="hot-streak-text-button" type="button" data-hot-streak-explain="cancel">Cancel</button>
          </div>
          <fieldset id="hotStreakDoubleChoices" class="hot-streak-double-box" data-hot-streak-explain="double" hidden>
            <legend>Race 3 · double one ticket</legend>
            <div id="hotStreakDoubleOptions"></div>
          </fieldset>
          <div id="hotStreakConfirmModes" class="hot-streak-mode-actions"></div>
        </div>
      </div>
    </section>

    <section id="hotStreakYourBetsSection" class="hot-streak-section hot-streak-your-bets" data-hot-streak-explain="players" hidden>
      <div class="hot-streak-section-head"><h3>🎟️ Your tickets</h3></div>
      <div id="hotStreakYourBets" class="hot-streak-player-bets"></div>
    </section>

    <section id="hotStreakHandSection" class="hot-streak-section hot-streak-hand-panel" aria-labelledby="hotStreakHandTitle">
      <div class="hot-streak-section-head">
        <h3 id="hotStreakHandTitle" data-hot-streak-explain="hand">🃏 Your race cards</h3>
        <span id="hotStreakSubmissionProgress" class="hot-streak-mini-status">0/0</span>
      </div>
      <p id="hotStreakHandHint" class="hot-streak-hint">Your private cards</p>
      <div id="hotStreakHand" class="hot-streak-hand" aria-label="Your race cards"></div>
      <button id="hotStreakSubmitBtn" class="hot-streak-primary" type="button" data-hot-streak-explain="submit">Submit Card</button>
    </section>

    <section id="hotStreakTrackSection" class="hot-streak-section hot-streak-track-panel" aria-label="Race track">
      <div class="hot-streak-track-controls">
        <button id="hotStreakTrackToggle" class="hot-streak-disclosure" type="button" aria-expanded="true" aria-controls="hotStreakTrackBody" data-hot-streak-explain="track_toggle">
          <span>🏁 Race track</span><span id="hotStreakTrackStatus" class="hot-streak-mini-status">Cycle 1</span>
        </button>
        <div id="hotStreakTrackTools" class="hot-streak-track-tools" role="group" aria-label="Track zoom">
          <button type="button" data-hot-streak-zoom="out" data-hot-streak-explain="zoom" aria-label="Zoom out">−</button>
          <button type="button" data-hot-streak-zoom="in" data-hot-streak-explain="zoom" aria-label="Zoom in">+</button>
          <button type="button" data-hot-streak-zoom="fit" data-hot-streak-explain="zoom">Fit</button>
          <button type="button" data-hot-streak-zoom="origin" data-hot-streak-explain="zoom">Origin</button>
        </div>
      </div>
      <div id="hotStreakTrackBody">
        <div class="hot-streak-track-caption" aria-hidden="true"><span class="hot-streak-cap-wide">Start → Finish 🏁</span><span class="hot-streak-cap-narrow">↑ Finish 🏁</span></div>
        <div id="hotStreakTrackViewport" class="hot-streak-track-viewport" tabindex="0" aria-label="Race track. Zoom to pan, or use arrow keys.">
          <div id="hotStreakTrack" class="hot-streak-track" role="grid" aria-label="Four lane race track" data-hot-streak-explain="track"></div>
        </div>
        <div id="hotStreakSwerveKey" class="hot-streak-swerve-key" data-hot-streak-explain="swerve"></div>
      </div>
    </section>

    <div id="hotStreakCurrentCard" class="hot-streak-current-card" aria-live="polite" hidden></div>

    <section id="hotStreakStandings" class="hot-streak-section hot-streak-standings-panel" data-hot-streak-explain="standings" hidden>
      <div class="hot-streak-section-head"><h3>🏆 Race order</h3></div>
      <div id="hotStreakStandingsList" class="hot-streak-standings-list"></div>
    </section>

    <section id="hotStreakResult" class="hot-streak-section hot-streak-result-panel" aria-live="polite" hidden>
      <div class="hot-streak-section-head">
        <h3 id="hotStreakResultTitle">Race results</h3>
        <span id="hotStreakReadyProgress" class="hot-streak-mini-status"></span>
      </div>
      <div id="hotStreakResultBody"></div>
      <div class="hot-streak-result-actions">
        <button id="hotStreakNextRaceBtn" class="hot-streak-primary" type="button" data-hot-streak-explain="next" hidden>Next Race</button>
        <button id="hotStreakPlayAgainBtn" class="hot-streak-primary" type="button" data-hot-streak-explain="again" hidden>Play Again</button>
      </div>
    </section>

    <button id="hotStreakContinueBtn" class="hot-streak-text-button" type="button" data-hot-streak-explain="continue" hidden>▶ Continue Race</button>

    <section id="hotStreakSideBetSection" class="hot-streak-section hot-streak-side-section" data-hot-streak-explain="side">
      <div class="hot-streak-section-head"><h3>🎲 Side bet</h3><span id="hotStreakSideResult" class="hot-streak-side-result">Pending</span></div>
      <p id="hotStreakSideBet" class="hot-streak-side-bet">-</p>
      <p id="hotStreakSideEvidence" class="hot-streak-hint" hidden></p>
    </section>

    <details id="hotStreakPoolSection" class="hot-streak-section hot-streak-pool-section" open>
      <summary class="hot-streak-disclosure" data-hot-streak-explain="pool"><span>🗂️ Public race pool</span><span id="hotStreakPoolCount" class="hot-streak-mini-status">0 cards</span></summary>
      <div id="hotStreakPool" class="hot-streak-pool" role="list" aria-label="Public race card pool" tabindex="0"></div>
    </details>

    <details id="hotStreakPlayersSection" class="hot-streak-section hot-streak-players-section">
      <summary class="hot-streak-disclosure" data-hot-streak-explain="players"><span>👥 Players</span><span id="hotStreakPlayersSummary" class="hot-streak-mini-status">-</span></summary>
      <div id="hotStreakPlayers" class="hot-streak-players"></div>
    </details>

    <section id="hotStreakLogPanel" class="hot-streak-section hot-streak-log-panel" hidden>
      <button id="hotStreakLogToggle" class="hot-streak-disclosure" type="button" aria-expanded="false" aria-controls="hotStreakLog" data-hot-streak-explain="log"><span>📜 Race log</span><span id="hotStreakLogCount" class="hot-streak-mini-status">0</span></button>
      <div id="hotStreakLog" class="hot-streak-log" tabindex="0" hidden></div>
    </section>
  </div>

  <footer class="hot-streak-footer">
    <button id="hotStreakNoticeToggle" class="hot-streak-text-button" type="button" aria-expanded="false" aria-controls="hotStreakDataNotice" data-hot-streak-explain="notice">ⓘ Prototype-compatible data</button>
    <p id="hotStreakDataNotice" class="hot-streak-hint" hidden>Star rows and Swerve directions match the second-printing rulebook. Other component values use prototype-compatible data.</p>
  </footer>
</template>
