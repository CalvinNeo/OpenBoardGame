<template data-game-target="caboPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="phaseLabel">-</span></div>
                <div>Round: <span id="roundLabel">-</span></div>
                <div>Current Turn: <span id="turnLabel">-</span></div>
              </div>
              <div class="row">
                <div>Deck: <span id="deckCount">-</span></div>
              </div>
              <div class="row">
                <div>Cabo Called By: <span id="caboBy">-</span></div>
                <div>Cabo Turns Left: <span id="caboLeft">-</span></div>
              </div>
              <div class="row">
                <div>Pending Choice: <span id="pendingChoice">-</span></div>
              </div>
              <p id="caboChoiceHint" class="cabo-choice-hint hidden" aria-live="polite"></p>

              <div class="row cabo-hand-header">
                <h3>Your Hand</h3>
                <button id="clearSelection" type="button">Cancel</button>
              </div>
              <div id="handSlots" class="hand"></div>
              <div class="row cabo-drawn-row">
                <div class="cabo-drawn-label">Just Drawn:</div>
                <div id="lastDrawn" class="slot cabo-drawn-slot">-</div>
                <button id="discardDrawnBtn">Discard Drawn</button>
              </div>
              <div class="row cabo-discard-row">
                <div class="cabo-discard">
                  <div class="cabo-discard-label">Discard Top:</div>
                  <button id="discardTop" class="slot cabo-discard-slot" type="button">-</button>
                </div>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <button id="peekBtn">Initial Peek</button>
                <button id="drawDeckBtn">Draw Deck</button>
                <button id="replaceBtn">Replace / Match</button>
                <button id="callCaboBtn">Call Cabo</button>
                <button id="choiceBtn">Use Choice</button>
                <button id="nextRoundBtn">Next Round</button>
              </div>

              <h3>Players</h3>
              <div id="gamePlayers"></div>
            </template>
