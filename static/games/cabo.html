<template data-game-target="caboPanel" data-game-mode="contents">
              <div class="cabo-toolbar">
                <h3>🃏 Cabo</h3>
                <div class="cabo-tools">
                  <button id="caboHelpBtn" type="button">Help</button>
                  <button id="caboExplainBtn" type="button" aria-pressed="false">Explain</button>
                </div>
              </div>
              <div class="row">
                <div data-cabo-explain="phase">Phase: <span id="phaseLabel">-</span></div>
                <div data-cabo-explain="round">Round: <span id="roundLabel">-</span></div>
                <div data-cabo-explain="turn">Current Turn: <span id="turnLabel">-</span></div>
              </div>
              <div class="row">
                <div data-cabo-explain="deck">Deck: <span id="deckCount">-</span></div>
              </div>
              <div class="row">
                <div data-cabo-explain="cabo_called">Cabo Called By: <span id="caboBy">-</span></div>
                <div data-cabo-explain="cabo_left">Cabo Turns Left: <span id="caboLeft">-</span></div>
              </div>
              <div class="row">
                <div data-cabo-explain="pending_choice">Pending Choice: <span id="pendingChoice">-</span></div>
              </div>
              <p id="caboChoiceHint" class="cabo-choice-hint hidden" aria-live="polite" data-cabo-explain="choice_hint"></p>

              <div class="row cabo-hand-header">
                <h3>Your Hand</h3>
                <button id="clearSelection" type="button" data-cabo-explain="cancel">Cancel</button>
              </div>
              <div id="handSlots" class="hand" data-cabo-explain="hand"></div>
              <div class="row cabo-drawn-row">
                <div class="cabo-drawn-label" data-cabo-explain="last_drawn">Just Drawn:</div>
                <div id="lastDrawn" class="slot cabo-drawn-slot" data-cabo-explain="last_drawn">-</div>
                <button id="discardDrawnBtn" data-cabo-explain="discard_drawn">Discard Drawn</button>
              </div>
              <div class="row cabo-discard-row">
                <div class="cabo-discard">
                  <div class="cabo-discard-label">Discard Top:</div>
                  <button id="discardTop" class="slot cabo-discard-slot" type="button" data-cabo-explain="discard_top">-</button>
                </div>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <button id="peekBtn" data-cabo-explain="initial_peek">Initial Peek</button>
                <button id="drawDeckBtn" data-cabo-explain="draw_deck">Draw Deck</button>
                <button id="replaceBtn" data-cabo-explain="replace_match">Replace / Match</button>
                <button id="callCaboBtn" data-cabo-explain="call_cabo">Call Cabo</button>
                <button id="choiceBtn" data-cabo-explain="use_choice">Use Choice</button>
                <button id="skipChoiceBtn" data-cabo-explain="skip_choice">Skip Choice</button>
                <button id="nextRoundBtn" data-cabo-explain="next_round">Next Round</button>
              </div>

              <h3>Players</h3>
              <div id="gamePlayers" data-cabo-explain="players"></div>
            </template>
