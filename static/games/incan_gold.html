<template data-game-target="incanGoldHeaderActions" data-game-mode="contents">
  <button id="incanGoldHelpBtn" type="button">Help</button>
  <button id="incanGoldExplainBtn" type="button" aria-pressed="false">Explain</button>
</template>
<template data-game-target="incanGoldPanel" data-game-mode="contents">
  <div class="incan-gold-overview">
    <strong data-incan-explain="round">Round <span id="incanGoldRound">-</span>/<span id="incanGoldMaxRounds">5</span></strong>
    <span id="incanGoldPhase" data-incan-explain="phase">Waiting</span>
    <span data-incan-explain="deck" data-incan-tip="Cards left in this expedition's draw pile.">Deck <strong id="incanGoldDeck">-</strong></span>
  </div>
  <div class="incan-gold-decision-meta">
    <span data-incan-explain="exploring">Exploring <strong id="incanGoldInCave">-</strong></span>
    <span data-incan-explain="decided">Decided <strong id="incanGoldDecided">-</strong></span>
    <span id="incanGoldRisk" data-incan-explain="risk" data-incan-tip="Chance the next card repeats a hazard already on the path, calculated from public cards.">Risk -</span>
  </div>
  <div class="incan-gold-personal" data-incan-explain="personal" data-incan-tip="Banked gems are safe. Gems in hand are lost if a second matching hazard appears. Artifacts add to your final score.">
    <span>Banked 💎 <strong id="incanGoldBanked">-</strong></span>
    <span>At risk 💎 <strong id="incanGoldHand">-</strong></span>
    <span>Artifacts 🏺 <strong id="incanGoldArtifacts">-</strong></span>
  </div>
  <div id="incanGoldRoundNotice" class="round-notice hidden" aria-hidden="true" data-incan-explain="round_notice">
    <div id="incanGoldRoundNoticeTitle" class="round-notice-title">Round End</div>
    <div id="incanGoldRoundNoticeBody" class="round-notice-body"></div>
    <div id="incanGoldWinnerRow" class="hidden">🏆 <strong id="incanGoldWinner"></strong></div>
  </div>
  <div id="incanGoldStatus" class="incan-gold-status" role="status" aria-live="polite" data-incan-explain="status">Waiting for game state…</div>
  <div class="incan-gold-actions">
    <button id="incanGoldContinueBtn" class="hidden" type="button" data-incan-explain="continue">Continue →</button>
    <button id="incanGoldLeaveBtn" class="hidden" type="button" data-incan-explain="leave">Leave &amp; bank 💎</button>
    <button id="incanGoldNextRoundBtn" class="hidden" type="button" data-incan-explain="next">Next Round</button>
    <button id="incanGoldPlayAgainBtn" class="hidden" type="button" data-incan-explain="again">Play Again</button>
  </div>
  <div class="incan-gold-section-heading">
    <h3>Expedition path</h3>
    <span id="incanGoldLoot" data-incan-explain="loot" data-incan-tip="Treasure remainders are divided separately on each card among returning explorers. Only a lone returner claims artifacts."></span>
  </div>
  <div id="incanGoldPath" class="incan-gold-path" aria-label="Revealed expedition cards" tabindex="0" data-incan-explain="path"></div>
  <h3>Explorers</h3>
  <div id="incanGoldPlayers" class="incan-gold-players" data-incan-explain="players"></div>
  <details class="incan-gold-history">
    <summary data-incan-explain="hazards">Hazards removed</summary>
    <div id="incanGoldRemovedHazards" class="incan-gold-hazards"></div>
  </details>
  <dialog id="incanGoldScoreboard" class="incan-gold-scoreboard" aria-labelledby="incanGoldScoreboardTitle">
    <div class="incan-gold-scoreboard-head">
      <h2 id="incanGoldScoreboardTitle">🏆 Final Scores</h2>
      <button id="incanGoldScoreboardClose" type="button">Close</button>
    </div>
    <ol id="incanGoldScoreboardRows" class="incan-gold-scoreboard-rows" data-incan-explain="scoreboard"></ol>
    <p id="incanGoldScoreboardNote" class="incan-gold-scoreboard-note"></p>
  </dialog>
</template>
