<template data-game-target="notAHatPanel" data-game-mode="contents">
              <div class="nah-root">
                <div class="nah-status">
                  <span class="nah-chip" data-nah-explain="shop">🎁 Shop <b id="notAHatShopCount">-</b></span>
                  <span class="nah-chip" data-nah-explain="shop_top">Next <b id="notAHatShopTop">-</b></span>
                  <span class="nah-chip" data-nah-explain="limit">💥 Limit <b id="notAHatLimit">-</b></span>
                </div>

                <div id="notAHatBanner" class="nah-banner" data-nah-explain="banner"></div>

                <div id="notAHatBoard" class="nah-board" data-nah-explain="board"></div>

                <div id="notAHatAction" class="nah-action" data-nah-explain="action"></div>

                <details class="nah-logbox" data-nah-explain="log">
                  <summary>Gift Log</summary>
                  <div id="notAHatLog" class="nah-log"></div>
                </details>
              </div>
            </template>
