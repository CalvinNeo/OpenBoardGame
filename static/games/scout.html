<template data-game-target="scoutPanel" data-game-mode="contents">
  <div class="scout-status" data-scout-explain="status">
    <div class="scout-status-round"><span class="scout-eyebrow">ROUND</span><strong id="scoutRound">-</strong></div>
    <div class="scout-status-turn"><span id="scoutPhase" class="scout-eyebrow">-</span><strong id="scoutTurn">-</strong></div>
    <span id="scoutVariant" class="scout-variant">-</span>
  </div>
  <section id="scoutRoundNotice" class="scout-round-notice hidden" aria-hidden="true">
    <div class="scout-section-heading"><h3 id="scoutRoundNoticeTitle">Last Round</h3></div>
    <p id="scoutRoundNoticeBody"></p>
    <details id="scoutRoundDetails"><summary>Score breakdown</summary><div id="scoutRoundNoticeList" class="scout-summary-list" data-scout-explain="scoring"></div></details>
  </section>
  <section id="scoutOpeningSection" class="hidden">
    <div class="scout-section-heading"><h3>🎪 Choose your opening</h3><span class="scout-muted">Keep or flip the whole hand</span></div>
    <div id="scoutOpening" class="scout-opening"></div>
    <div class="scout-next-round"><button id="scoutNextRoundBtn" type="button" data-scout-explain="nextRound">Next Round</button></div>
  </section>
  <div class="scout-table-layout">
    <div class="scout-play-area">
      <section id="scoutStageSection" class="scout-stage">
        <div class="scout-section-heading"><h3>🎭 On stage</h3><span class="scout-eyebrow">SHOW TO BEAT</span></div>
        <div id="scoutActiveSet" class="scout-active-set" data-scout-explain="activeSet"></div>
      </section>
      <section id="scoutHandSection" class="scout-hand-section">
        <div class="scout-section-heading"><h3>🎴 Your hand <span id="scoutHandCount" class="scout-count"></span></h3><button id="scoutHintBtn" class="scout-quiet-btn" type="button" data-scout-explain="hintBtn">Hint</button></div>
        <p id="scoutHint" class="scout-hint" role="status" aria-live="polite"></p>
        <div id="scoutHand" class="scout-hand-shell" data-scout-explain="yourHand"></div>
        <div class="scout-hand-footer">
          <span id="scoutSelectionLabel" class="scout-selection" aria-live="polite">Select adjacent cards</span>
          <div class="scout-confirm-buttons">
            <button id="scoutShowBtn" type="button" data-scout-explain="showBtn">Show Selected</button>
            <button id="scoutScoutBtn" type="button" data-scout-explain="scoutBtn" class="hidden">Scout</button>
            <button id="scoutScoutShowBtn" type="button" data-scout-explain="scoutShowBtn" class="hidden">Scout + Show</button>
          </div>
        </div>
        <details id="scoutPreviewSection" class="scout-preview-section hidden"><summary>After Scout Preview</summary><div id="scoutPreviewArea" class="scout-preview-area" data-scout-explain="previewHand"></div></details>
      </section>
    </div>
    <aside class="scout-player-area">
      <div class="scout-section-heading"><h3>Players</h3><span class="scout-eyebrow">SCORE / ROUND</span></div>
      <div id="scoutPlayers" class="scout-players" data-scout-explain="players"></div>
      <details class="scout-table-details"><summary>Table details</summary><dl><div><dt>Start player</dt><dd id="scoutStartPlayer">-</dd></div><div><dt>Center Scout tokens</dt><dd id="scoutCenterTokens">-</dd></div></dl></details>
    </aside>
  </div>
  <div id="scoutTooltip" class="scout-tooltip hidden" role="tooltip"></div>
</template>
