<template data-game-target="turingMachinePanel" data-game-mode="contents">
  <div class="tm-status-bar">
    <div class="tm-round-badge">Round <strong id="turingMachineRound">-</strong></div>
    <div id="turingMachineStatus" class="tm-status" role="status">-</div>
    <button id="turingMachineNotebookToggle" type="button" aria-controls="turingMachineNotebook" aria-expanded="false">Notebook</button>
  </div>
  <div class="tm-layout">
    <div class="tm-main-board">
      <section class="tm-machine-section" aria-label="Code console" data-turing-machine-explain="console">
        <div class="tm-section-heading">
          <h3 class="tm-section-title">Code console</h3>
          <span class="tm-checks">Checks left <strong id="turingMachineTestsRemaining">-</strong></span>
        </div>
        <div id="turingMachineCodeBuilder" class="tm-code-builder"></div>
        <div class="tm-console-footer">
          <div class="tm-round-code">Round code <strong id="turingMachineCurrentProposal">-</strong></div>
          <div class="tm-console-buttons">
            <button id="turingMachineUseCodeBtn" class="tm-primary" type="button" data-turing-machine-explain="lock">Lock code</button>
            <button id="turingMachineGuessBtn" type="button" data-turing-machine-explain="guess">Final guess</button>
          </div>
        </div>
        <div id="turingMachineConfirmation" class="tm-confirmation hidden" aria-hidden="true" role="group" aria-label="Confirm action">
          <strong id="turingMachineConfirmationText"></strong>
          <div class="tm-console-buttons">
            <button id="turingMachineConfirmBtn" class="tm-primary" type="button">Confirm</button>
            <button id="turingMachineCancelBtn" type="button">Cancel</button>
          </div>
        </div>
        <div class="tm-round-footer">
          <div id="turingMachineCurrentTests" class="tm-current-tests" aria-live="polite"></div>
          <button id="turingMachineEndRoundBtn" type="button" data-turing-machine-explain="next">Next Round</button>
        </div>
      </section>
      <section class="tm-verifiers-section" aria-label="Verifier cards">
        <div class="tm-section-heading"><h3 class="tm-section-title">Verifier cards</h3><span class="tm-caption">One hidden rule per card</span></div>
        <div id="turingMachineCriteria" class="tm-verifier-grid"></div>
      </section>
    </div>
    <aside id="turingMachineNotebook" class="tm-notebook" aria-label="Personal notebook">
      <div class="tm-section-heading tm-notebook-heading"><h3 class="tm-section-title">Personal notebook</h3><button id="turingMachineNotebookClose" type="button">Dock</button></div>
      <div class="tm-notebook-body">
        <section class="tm-section tm-collapsible-panel" id="turingMachineNotesPanel">
          <button id="turingMachineNotesToggle" class="tm-section-toggle" type="button" aria-expanded="false" aria-controls="turingMachineNotesContent"><span>Manual notes</span><span class="tm-section-toggle-icon" aria-hidden="true">⌄</span></button>
          <div id="turingMachineNotesContent" class="tm-collapsible-content hidden" aria-hidden="true"><div id="turingMachineNotes" class="tm-notes-board"></div></div>
        </section>
        <section class="tm-section tm-collapsible-panel hidden" id="turingMachineDeductionPanel" aria-hidden="true">
          <button id="turingMachineDeductionToggle" class="tm-section-toggle" type="button" aria-expanded="false" aria-controls="turingMachineDeductionContent"><span>Auto deduction</span><span class="tm-section-toggle-meta"><strong id="turingMachineCandidateCount">-</strong> codes <span class="tm-section-toggle-icon" aria-hidden="true">⌄</span></span></button>
          <div id="turingMachineDeductionContent" class="tm-collapsible-content hidden" aria-hidden="true">
            <div id="turingMachineCandidateGrid" class="tm-candidate-grid"></div>
            <div id="turingMachineDigitStats" class="tm-stats-grid"></div>
            <div id="turingMachineVariantStats" class="tm-stats-grid"></div>
          </div>
        </section>
        <section class="tm-section tm-collapsible-panel" id="turingMachineClueHistoryPanel">
          <button id="turingMachineClueHistoryToggle" class="tm-section-toggle" type="button" aria-expanded="false" aria-controls="turingMachineClueHistoryContent"><span>Verifier history</span><span class="tm-section-toggle-icon" aria-hidden="true">⌄</span></button>
          <div id="turingMachineClueHistoryContent" class="tm-collapsible-content hidden" aria-hidden="true"><div id="turingMachineClueHistory" class="tm-history-list"></div></div>
        </section>
        <details class="tm-details"><summary>Final guesses</summary><div id="turingMachineGuessHistory" class="tm-history-list"></div></details>
      </div>
    </aside>
  </div>
  <section id="turingMachineSolutionRow" class="tm-solution hidden" aria-hidden="true" aria-label="Final result">
    <h3 class="tm-section-title">Puzzle complete</h3>
    <div>Solution <strong id="turingMachineSolution">-</strong></div>
    <div>Winners <strong id="turingMachineWinners">-</strong></div>
  </section>
  <section class="tm-players-section"><h3 id="turingMachinePlayersTitle" class="tm-section-title">Players</h3><div id="turingMachinePlayers" class="tm-player-grid"></div></section>
  <div class="tm-bottom-bar">
    <details class="tm-details tm-session-details"><summary>Puzzle details</summary><div class="tm-session-grid">
      <div>Phase <strong id="turingMachinePhase">-</strong></div><div>Mode <strong id="turingMachineMode">-</strong></div>
      <div>Difficulty <strong id="turingMachineDifficulty">-</strong></div><div>Scenario <strong id="turingMachineScenario">-</strong></div>
      <div>Share seed <strong id="turingMachineSeed">-</strong></div><div>Waiting for <strong id="turingMachineBlocking">-</strong></div>
    </div></details>
    <button id="turingMachineGiveUpBtn" class="tm-quiet" type="button" data-turing-machine-explain="give_up">Give Up</button>
  </div>
  <details class="tm-details"><summary>Public log</summary><div id="turingMachinePublicLog" class="tm-history-list"></div></details>
  <div id="turingMachineTooltip" class="tm-tooltip hidden" role="tooltip"></div>
</template>
