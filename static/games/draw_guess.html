<template data-game-target="drawGuessPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="drawGuessPhase">-</span></div>
                <div>Round: <span id="drawGuessRound">-</span>/<span id="drawGuessTotalRounds">-</span></div>
                <div>Submitted: <span id="drawGuessSubmitted">-</span></div>
              </div>

              <div class="row" id="drawGuessPromptRow">
                <div>Prompt: <span id="drawGuessPrompt">-</span></div>
              </div>

              <div id="drawGuessDrawArea">
                <div class="row">
                  <canvas id="drawGuessCanvas" width="480" height="360"></canvas>
                </div>
                <div class="row draw-guess-colors" id="drawGuessColorPalette">
                  <span class="draw-guess-color-label">Color:</span>
                  <button class="draw-guess-color" type="button" data-color="#000000" style="background: #000000;" title="Black" aria-label="Black"></button>
                  <button class="draw-guess-color" type="button" data-color="#ef4444" style="background: #ef4444;" title="Red" aria-label="Red"></button>
                  <button class="draw-guess-color" type="button" data-color="#f97316" style="background: #f97316;" title="Orange" aria-label="Orange"></button>
                  <button class="draw-guess-color" type="button" data-color="#eab308" style="background: #eab308;" title="Yellow" aria-label="Yellow"></button>
                  <button class="draw-guess-color" type="button" data-color="#facc15" style="background: #facc15;" title="Bright Yellow" aria-label="Bright Yellow"></button>
                  <button class="draw-guess-color" type="button" data-color="#22c55e" style="background: #22c55e;" title="Green" aria-label="Green"></button>
                  <button class="draw-guess-color" type="button" data-color="#3b82f6" style="background: #3b82f6;" title="Blue" aria-label="Blue"></button>
                  <button class="draw-guess-color" type="button" data-color="#8b5cf6" style="background: #8b5cf6;" title="Purple" aria-label="Purple"></button>
                  <button class="draw-guess-color" type="button" data-color="#a16207" style="background: #a16207;" title="Brown" aria-label="Brown"></button>
                </div>
                <div class="row draw-guess-brush" id="drawGuessBrushSizes">
                  <span class="draw-guess-color-label">Brush:</span>
                  <button class="draw-guess-size" type="button" data-size="2" title="Small brush" aria-label="Small brush">S</button>
                  <button class="draw-guess-size" type="button" data-size="3" title="Medium brush" aria-label="Medium brush">M</button>
                  <button class="draw-guess-size" type="button" data-size="6" title="Large brush" aria-label="Large brush">L</button>
                  <button class="draw-guess-size" type="button" data-size="9" title="Extra large brush" aria-label="Extra large brush">XL</button>
                </div>
                <div class="row actions">
                  <button id="drawGuessClearBtn">Clear</button>
                  <button id="drawGuessEraserBtn">Eraser</button>
                  <button id="drawGuessSubmitDrawBtn">Submit Drawing</button>
                </div>
              </div>

              <div id="drawGuessGuessArea">
                <div class="row">
                  <img id="drawGuessImage" class="draw-guess-image" alt="Drawing to guess" />
                </div>
                <div class="row hidden" id="drawGuessAnswerLengthHintRow">
                  <div class="hint">Display length: <span id="drawGuessAnswerLength">-</span></div>
                </div>
                <div class="row actions">
                  <input id="drawGuessInput" type="text" placeholder="Your guess" />
                  <button id="drawGuessSubmitGuessBtn">Submit Guess</button>
                </div>
              </div>

              <h3>Players</h3>
              <div id="drawGuessPlayers"></div>

              <div id="drawGuessReview" class="hidden">
                <h3>Review</h3>
                <div id="drawGuessBooks"></div>
                <div class="row actions">
                  <button id="drawGuessRestartBtn">Play Again</button>
                </div>
              </div>
            </template>
