<template data-game-target="ticketToRideHeaderActions" data-game-mode="contents">
  <button id="ticketToRideHelpBtn" type="button" aria-label="Help" title="Help">Help</button>
  <button id="ticketToRideExplainBtn" type="button" aria-label="Explain" title="Explain" aria-pressed="false">Explain</button>
</template>
<template data-game-target="ticketToRidePanel" data-game-mode="contents">
  <header class="ttr-heading">
    <div id="ticketToRideRound" class="ttr-round" data-ttr-explain="turn" data-ttr-tip="Turn：当前是第几个行动。Final Round：有人降到 2 辆以下后，每人还有最后一次行动。" tabindex="0">Setup</div>
    <strong id="ticketToRideStatus" class="ttr-status" role="status" aria-live="polite">Waiting to start</strong>
    <div id="ticketToRideDeckInfo" class="ttr-deck-info" data-ttr-explain="deck" data-ttr-tip="🂠 抽牌堆剩余张数；♻️ 弃牌堆张数，牌堆耗尽时会洗回。" tabindex="0"></div>
  </header>
  <div id="ticketToRideStats" class="ttr-stats"></div>
  <div class="ttr-board">
    <section class="ttr-map-section" aria-label="North America rail network" data-ttr-explain="map">
      <div class="ttr-section-heading">
        <h3>01 / THE MAP</h3>
        <div class="ttr-map-controls">
          <button id="ticketToRideZoomOut" type="button" aria-label="Zoom out" data-ttr-explain="zoom">−</button>
          <button id="ticketToRideZoomIn" type="button" aria-label="Zoom in" data-ttr-explain="zoom">+</button>
          <button id="ticketToRideFit" type="button" data-ttr-explain="zoom">Fit</button>
          <button id="ticketToRideOrigin" type="button" data-ttr-explain="origin">1:1</button>
          <button id="ticketToRideFocus" type="button" aria-label="Full-screen map" data-ttr-explain="focus">⛶</button>
        </div>
      </div>
      <div id="ticketToRideMapFrame" class="ttr-map-frame">
        <svg id="ticketToRideMap" viewBox="0 0 1000 640" role="img" aria-label="North America route map; choose a route or use the route list"></svg>
        <div id="ticketToRideRouteOverlay" class="ttr-route-overlay hidden"></div>
      </div>
      <details class="ttr-route-list"><summary>Route list · claimable routes</summary><div id="ticketToRideRoutes"></div></details>
    </section>
    <div class="ttr-workstation">
      <section class="ttr-market-section" aria-label="Face-up train cards" data-ttr-explain="market">
        <div class="ttr-section-heading">
          <h3>02 / CARD MARKET</h3>
          <span id="ticketToRideDrawHint" class="ttr-draw-hint" data-ttr-explain="draw" tabindex="0"></span>
        </div>
        <div id="ticketToRideMarket" class="ttr-market"></div>
      </section>
      <section class="ttr-hand-section" aria-label="Your train cards" data-ttr-explain="hand">
        <div class="ttr-section-heading"><h3>03 / YOUR HAND</h3><span id="ticketToRideHandCount"></span></div>
        <div id="ticketToRideHand" class="ttr-hand"></div>
      </section>
      <section id="ticketToRideTicketsSection" class="ttr-tickets-section" aria-label="Your destination tickets" data-ttr-explain="tickets">
        <div class="ttr-section-heading">
          <h3>04 / YOUR TICKETS</h3>
          <div class="ttr-ticket-tools">
            <span id="ticketToRideTicketCount"></span>
            <button id="ticketToRideTicketAction" type="button" data-ttr-explain="draw_tickets">🎫 Draw 3</button>
          </div>
        </div>
        <div id="ticketToRideTickets" class="ttr-tickets"></div>
      </section>
    </div>
  </div>
  <section id="ticketToRideReview" class="ttr-review hidden" aria-label="Final scores">
    <div class="ttr-section-heading"><h3 id="ticketToRideReviewTitle">FINAL SCORES</h3></div>
    <div id="ticketToRideResults" class="ttr-results"></div>
  </section>
  <section class="ttr-players-section" aria-label="Players">
    <div class="ttr-section-heading"><h3>AT THE TABLE</h3><span data-ttr-explain="players" data-ttr-tip="🚃 剩余车厢；🃏 手牌数；🎫 车票数；线路分为已结算的分数。" tabindex="0">🚃 · 🃏 · 🎫</span></div>
    <div id="ticketToRidePlayers" class="ttr-players"></div>
  </section>
  <details class="ttr-log"><summary>Activity log</summary><ol id="ticketToRideLog"></ol></details>
  <div id="ticketToRideTooltip" class="ttr-tooltip hidden" role="tooltip"></div>
</template>
