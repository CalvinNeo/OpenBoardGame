<template data-game-target="felixHelpModal" data-game-mode="replace"><section id="felixHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content felix-help-modal">
      <div class="modal-header">
        <h2>Felix - Game Rules</h2>
        <button id="felixHelpCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body felix-help-content"></div>
    </div>
  </section></template>
<template data-game-target="felixExplainModal" data-game-mode="replace"><section id="felixExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="felixExplainCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="felixExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="felixPanel" data-game-mode="contents">
              <div class="felix-topbar">
                <div>
                  <h2>Felix: The Cat in the Sack</h2>
                  <div class="felix-subtitle">
                    Round <span id="felixRound">-</span>/9 · Phase <span id="felixPhase">-</span>
                  </div>
                </div>
                <div class="felix-header-actions" id="felixHeaderActions">
                  <button id="felixHelpBtn" type="button">Help</button>
                  <button id="felixExplainBtn" type="button">Explain</button>
                </div>
              </div>

              <div id="felixNotice" class="round-notice hidden">
                <div id="felixNoticeTitle" class="round-notice-title">Round Summary</div>
                <div id="felixNoticeBody" class="round-notice-body">-</div>
                <div id="felixFinalResults" class="felix-final-results"></div>
              </div>

              <div class="felix-table">
                <section class="felix-sack">
                  <h3>Bag</h3>
                  <div id="felixMouseCards" class="felix-mouse-row"></div>
                  <div id="felixTableSlots" class="felix-slot-row"></div>
                </section>

                <section class="felix-auction">
                  <h3>Auction</h3>
                  <div class="felix-auction-meta">
                    <div>Current Turn: <span id="felixTurn">-</span></div>
                    <div>Start Player: <span id="felixStart">-</span></div>
                    <div>High Bid: <span id="felixBid">-</span> 🐭</div>
                    <div>High Bidder: <span id="felixBidder">-</span></div>
                    <div>Bank: <span id="felixBank">-</span> 🐭</div>
                  </div>
                  <div class="felix-bid-controls">
                    <label for="felixBidInput">Bid</label>
                    <input id="felixBidInput" type="number" min="1" step="1" inputmode="numeric" />
                    <button id="felixBidBtn" type="button">Bid</button>
                    <button id="felixPassBtn" type="button">Pass</button>
                    <button id="felixBuyOneBtn" type="button">Buy for 1</button>
                    <button id="felixNextBtn" type="button">Next Round</button>
                  </div>
                </section>
              </div>

              <section class="felix-hand-section">
                <h3>Your Hand</h3>
                <div id="felixHand" class="felix-hand"></div>
              </section>

              <h3>Players</h3>
              <div id="felixPlayers" class="felix-players"></div>
            </template>
