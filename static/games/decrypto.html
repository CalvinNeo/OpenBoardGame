<template data-game-target="decryptoHelpModal" data-game-mode="replace"><section id="decryptoHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content decrypto-help-modal">
      <div class="modal-header">
        <h2>Decrypto - Game Rules</h2>
        <button id="decryptoHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body decrypto-help-content" id="decryptoHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="decryptoExplainModal" data-game-mode="replace"><section id="decryptoExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content decrypto-explain-modal">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="decryptoExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="decryptoExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="decryptoPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="decryptoPhase">-</span></div>
                <div>Round: <span id="decryptoRound">-</span>/<span id="decryptoMaxRounds">-</span></div>
                <div>Winner: <span id="decryptoWinner">-</span></div>
              </div>
              <div class="row">
                <div>Your Team: <span id="decryptoYourTeam">-</span></div>
                <div>Your Role: <span id="decryptoYourRole">-</span></div>
                <div>Current Code: <span id="decryptoCurrentCode">-</span></div>
              </div>

              <div id="decryptoStatus" class="decrypto-status waiting" role="status" aria-live="polite">
                <div class="decrypto-status-title">Your Next Step</div>
                <div id="decryptoStatusBody" class="decrypto-status-body">-</div>
              </div>

              <h3>Teams</h3>
              <div id="decryptoTeams"></div>

              <h3>Current Clues</h3>
              <div id="decryptoCurrentClues"></div>

              <h3>History</h3>
              <div id="decryptoHistory"></div>

              <div id="decryptoEncryptionArea">
                <h3>Submit Clues</h3>
                <div class="row actions decrypto-clue-row">
                  <div class="decrypto-clue-entry">
                    <div class="decrypto-clue-code">
                      <span class="decrypto-clue-digit" id="decryptoClueDigit1">-</span>
                      <span class="decrypto-clue-word" id="decryptoClueWord1">-</span>
                    </div>
                    <input id="decryptoClue1" type="text" placeholder="Clue 1" />
                  </div>
                  <div class="decrypto-clue-entry">
                    <div class="decrypto-clue-code">
                      <span class="decrypto-clue-digit" id="decryptoClueDigit2">-</span>
                      <span class="decrypto-clue-word" id="decryptoClueWord2">-</span>
                    </div>
                    <input id="decryptoClue2" type="text" placeholder="Clue 2" />
                  </div>
                  <div class="decrypto-clue-entry">
                    <div class="decrypto-clue-code">
                      <span class="decrypto-clue-digit" id="decryptoClueDigit3">-</span>
                      <span class="decrypto-clue-word" id="decryptoClueWord3">-</span>
                    </div>
                    <input id="decryptoClue3" type="text" placeholder="Clue 3" />
                  </div>
                  <button id="decryptoSubmitCluesBtn">Submit Clues</button>
                </div>
                <div class="decrypto-clue-missing hidden" id="decryptoClueMissingRow">
                  Unused keyword: <span class="decrypto-clue-missing-word" id="decryptoClueMissingWord">-</span>
                </div>
              </div>

              <div id="decryptoGuessArea">
                <h3>Submit Decrypt Guess</h3>
                <div class="decrypto-guess-grid">
                  <div class="decrypto-guess-row">
                    <label class="decrypto-guess-clue" id="decryptoDecryptClueLabel1" for="decryptoDecryptSelect1">Clue 1: -</label>
                    <select id="decryptoDecryptSelect1" class="decrypto-guess-select">
                      <option value="">-</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </div>
                  <div class="decrypto-guess-row">
                    <label class="decrypto-guess-clue" id="decryptoDecryptClueLabel2" for="decryptoDecryptSelect2">Clue 2: -</label>
                    <select id="decryptoDecryptSelect2" class="decrypto-guess-select">
                      <option value="">-</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </div>
                  <div class="decrypto-guess-row">
                    <label class="decrypto-guess-clue" id="decryptoDecryptClueLabel3" for="decryptoDecryptSelect3">Clue 3: -</label>
                    <select id="decryptoDecryptSelect3" class="decrypto-guess-select">
                      <option value="">-</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </div>
                </div>
                <div class="row actions">
                  <button id="decryptoSubmitDecryptBtn">Submit Decrypt</button>
                </div>
                <h3>Submit Intercept Guess</h3>
                <div class="decrypto-guess-grid">
                  <div class="decrypto-guess-row">
                    <label class="decrypto-guess-clue" id="decryptoInterceptClueLabel1" for="decryptoInterceptSelect1">Clue 1: -</label>
                    <select id="decryptoInterceptSelect1" class="decrypto-guess-select">
                      <option value="">-</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </div>
                  <div class="decrypto-guess-row">
                    <label class="decrypto-guess-clue" id="decryptoInterceptClueLabel2" for="decryptoInterceptSelect2">Clue 2: -</label>
                    <select id="decryptoInterceptSelect2" class="decrypto-guess-select">
                      <option value="">-</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </div>
                  <div class="decrypto-guess-row">
                    <label class="decrypto-guess-clue" id="decryptoInterceptClueLabel3" for="decryptoInterceptSelect3">Clue 3: -</label>
                    <select id="decryptoInterceptSelect3" class="decrypto-guess-select">
                      <option value="">-</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                    </select>
                  </div>
                </div>
                <div class="row actions">
                  <button id="decryptoSubmitInterceptBtn">Submit Intercept</button>
                </div>
              </div>

              <div id="decryptoSummary" class="round-notice hidden">
                <div class="round-notice-title">Last Round</div>
                <div id="decryptoSummaryBody" class="round-notice-body">-</div>
              </div>

            </template>
