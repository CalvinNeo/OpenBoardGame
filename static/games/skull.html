<template data-game-target="skullPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="skullPhase">-</span></div>
                <div>Round: <span id="skullRound">-</span></div>
                <div>Current Turn: <span id="skullTurn">-</span></div>
              </div>
              <div class="row">
                <div>Current Bid: <span id="skullBid">-</span></div>
                <div>Bidder: <span id="skullBidder">-</span></div>
                <div>Passed: <span id="skullPassed">-</span></div>
              </div>
              <div class="row">
                <div>Roses Revealed: <span id="skullRoses">-</span></div>
                <div>Last Reveal: <span id="skullLastReveal">-</span></div>
                <div>Winner: <span id="skullWinner">-</span></div>
              </div>

              <h3>Your Hand</h3>
              <div id="skullHand" class="hand"></div>
              <div class="row">
                <div>Selected Card: <span id="skullSelectedCard">-</span></div>
                <button id="skullClearSelection">Clear</button>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <input id="skullBidInput" type="number" min="1" placeholder="Bid" />
                <button id="skullPlayBtn">Play Card</button>
                <button id="skullStartBidBtn">Start Bid</button>
                <button id="skullRaiseBidBtn">Raise Bid</button>
                <button id="skullPassBidBtn">Pass</button>
                <button id="skullRevealBtn">Reveal</button>
              </div>

              <h3>Targets</h3>
              <div class="row">
                <div>Selected Target: <span id="skullTargetSelection">-</span></div>
              </div>
              <div id="skullTargets" class="target-list"></div>

              <h3>Players</h3>
              <div id="skullPlayers"></div>
            </template>
