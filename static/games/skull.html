<template data-game-target="skullPanel" data-game-mode="contents">
              <div class="skull-toolbar">
                <h3>💀 Skull</h3>
                <div class="skull-tools">
                  <button id="skullHelpBtn" type="button">Help</button>
                  <button id="skullExplainBtn" type="button" aria-pressed="false">Explain</button>
                </div>
              </div>
              <div class="row">
                <div data-skull-explain="phase">Phase: <span id="skullPhase">-</span></div>
                <div data-skull-explain="round">Round: <span id="skullRound">-</span></div>
                <div data-skull-explain="turn">Current Turn: <span id="skullTurn">-</span></div>
              </div>
              <div class="row">
                <div data-skull-explain="bid">Current Bid: <span id="skullBid">-</span></div>
                <div data-skull-explain="bidder">Bidder: <span id="skullBidder">-</span></div>
                <div data-skull-explain="passed">Passed: <span id="skullPassed">-</span></div>
              </div>
              <div class="row">
                <div data-skull-explain="roses">Roses Revealed: <span id="skullRoses">-</span></div>
                <div data-skull-explain="last_reveal">Last Reveal: <span id="skullLastReveal">-</span></div>
                <div data-skull-explain="winner">Winner: <span id="skullWinner">-</span></div>
              </div>

              <h3>Your Hand</h3>
              <div id="skullHand" class="hand" data-skull-explain="hand"></div>
              <div class="row">
                <div data-skull-explain="selected">Selected Card: <span id="skullSelectedCard">-</span></div>
                <button id="skullClearSelection" data-skull-explain="clear">Clear</button>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <input id="skullBidInput" type="number" min="1" placeholder="Bid" data-skull-explain="bid_input" />
                <button id="skullPlayBtn" data-skull-explain="play_card">Play Card</button>
                <button id="skullStartBidBtn" data-skull-explain="start_bid">Start Bid</button>
                <button id="skullRaiseBidBtn" data-skull-explain="raise_bid">Raise Bid</button>
                <button id="skullPassBidBtn" data-skull-explain="pass_bid">Pass</button>
                <button id="skullRevealBtn" data-skull-explain="reveal_card">Reveal</button>
              </div>

              <h3>Targets</h3>
              <div class="row">
                <div data-skull-explain="selected_target">Selected Target: <span id="skullTargetSelection">-</span></div>
              </div>
              <div id="skullTargets" class="target-list" data-skull-explain="targets"></div>

              <h3>Players</h3>
              <div id="skullPlayers" data-skull-explain="players"></div>
            </template>
