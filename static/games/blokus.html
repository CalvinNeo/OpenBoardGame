<template data-game-target="blokusHelpModal" data-game-mode="replace"><section id="blokusHelpModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="blokusHelpModalTitle">
    <div class="modal-content blokus-help-modal">
      <div class="modal-header">
        <h2 id="blokusHelpModalTitle">Blokus - Game Rules</h2>
        <button id="blokusHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body blokus-help-content"></div>
    </div>
  </section></template>
<template data-game-target="blokusExplainModal" data-game-mode="replace"><section id="blokusExplainModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="blokusExplainModalTitle">
    <div class="modal-content blokus-explain-modal">
      <div class="modal-header">
        <h2 id="blokusExplainModalTitle">Button Explanation</h2>
        <button id="blokusExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="blokusExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="blokusPanel" data-game-mode="contents">
              <div class="row">
                <div>Status: <span id="blokusStatus">-</span></div>
                <div>Current Turn: <span id="blokusTurn">-</span></div>
                <div>Winner: <span id="blokusWinner">-</span></div>
              </div>
              <div class="row">
                <div>Selected Piece: <span id="blokusSelectedPiece">-</span></div>
                <div>Position: <span id="blokusOrigin">-</span></div>
              </div>
              <div class="row">
                <button id="blokusGiveUpBtn">Give Up</button>
              </div>
              <div class="row">
                <div class="hint">Select a piece, then tap or drag it on the board. Transform controls stay outside the board.</div>
              </div>

              <div class="blokus-layout">
                <div>
                  <h3>Board</h3>
                  <div class="blokus-board-wrapper">
                    <div class="blokus-board-stage">
                      <div id="blokusBoard" class="blokus-board"></div>
                      <div id="blokusPivot" class="blokus-piece-pivot hidden" aria-hidden="true"></div>
                    </div>
                    <div id="blokusBoardControls" class="blokus-board-controls hidden">
                      <div class="blokus-transform-controls" role="group" aria-label="Rotate and flip piece">
                        <button id="blokusRotateLeftBtn" type="button" class="blokus-control-btn" title="Rotate 90° left (Q)" aria-label="Rotate 90 degrees left" aria-keyshortcuts="Q">
                          <span class="blokus-control-icon" aria-hidden="true">↺</span>
                          <span class="blokus-control-text">Left</span>
                        </button>
                        <button id="blokusFlipBtn" type="button" class="blokus-control-btn" title="Flip piece (F)" aria-label="Flip piece" aria-keyshortcuts="F">
                          <span class="blokus-control-icon" aria-hidden="true">⇋</span>
                          <span class="blokus-control-text">Flip</span>
                        </button>
                        <button id="blokusRotateRightBtn" type="button" class="blokus-control-btn" title="Rotate 90° right (E)" aria-label="Rotate 90 degrees right" aria-keyshortcuts="E">
                          <span class="blokus-control-icon" aria-hidden="true">↻</span>
                          <span class="blokus-control-text">Right</span>
                        </button>
                      </div>
                      <button id="blokusPlaceBtn" type="button" class="blokus-place-control" title="Place piece (Enter)" aria-keyshortcuts="Enter">
                        Place Piece
                      </button>
                      <div class="blokus-nudge-section">
                        <span class="blokus-control-label">Move</span>
                        <div class="blokus-nudge-grid" role="group" aria-label="Move piece one cell">
                          <button id="blokusNudgeUpBtn" type="button" class="blokus-control-btn blokus-nudge-btn blokus-nudge-up" title="Move up (Arrow Up)" aria-label="Move up one cell" aria-keyshortcuts="ArrowUp">
                          &uarr;
                          </button>
                          <button id="blokusNudgeLeftBtn" type="button" class="blokus-control-btn blokus-nudge-btn blokus-nudge-left" title="Move left (Arrow Left)" aria-label="Move left one cell" aria-keyshortcuts="ArrowLeft">
                          &larr;
                          </button>
                          <span class="blokus-nudge-center" aria-hidden="true">◎</span>
                          <button id="blokusNudgeRightBtn" type="button" class="blokus-control-btn blokus-nudge-btn blokus-nudge-right" title="Move right (Arrow Right)" aria-label="Move right one cell" aria-keyshortcuts="ArrowRight">
                          &rarr;
                          </button>
                          <button id="blokusNudgeDownBtn" type="button" class="blokus-control-btn blokus-nudge-btn blokus-nudge-down" title="Move down (Arrow Down)" aria-label="Move down one cell" aria-keyshortcuts="ArrowDown">
                          &darr;
                          </button>
                        </div>
                      </div>
                      <div class="blokus-controls-hint">Drag · arrows move · Q/E rotate · F flip</div>
                    </div>
                  </div>
                </div>
                <div class="blokus-pieces-column">
                  <div class="blokus-pieces-header">
                    <h3>Pieces</h3>
                  </div>
                  <div id="blokusPieces" class="blokus-pieces"></div>
                </div>
                <div>
                  <h3>Players</h3>
                  <div id="blokusPlayers"></div>
                </div>
              </div>
            </template>
