<template data-game-target="wordDecodeHelpModal" data-game-mode="replace"><section id="wordDecodeHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content word-decode-help-modal">
      <div class="modal-header">
        <h2>猜字解底 - Game Rules</h2>
        <button id="wordDecodeHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body word-decode-help-content" id="wordDecodeHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="wordDecodeExplainModal" data-game-mode="replace"><section id="wordDecodeExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content word-decode-explain-modal">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="wordDecodeExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="wordDecodeExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="wordDecodePanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="wordDecodePhase">-</span></div>
                <div>Round: <span id="wordDecodeRound">-</span></div>
                <div>Your Word: <span id="wordDecodeHidden">-</span></div>
              </div>
              <div class="row">
                <div>Hints Submitted: <span id="wordDecodeHintsSubmitted">-</span></div>
                <div>Guesses Submitted: <span id="wordDecodeGuessesSubmitted">-</span></div>
                <div>Guess Timer: <span id="wordDecodeGuessTimer">-</span></div>
              </div>

              <div id="wordDecodeHintArea">
                <h3>Write Hints</h3>
                <div class="row actions word-decode-hint-row">
                  <input id="wordDecodeHint1" type="text" placeholder="Hint 1" />
                  <input id="wordDecodeHint2" type="text" placeholder="Hint 2" />
                  <button id="wordDecodeSubmitHintsBtn">Submit Hints</button>
                </div>
                <div class="hint">Each hint should form a common two-character word with your hidden word.</div>
              </div>

              <div id="wordDecodeGuessArea">
                <h3>Hints</h3>
                <div id="wordDecodeHintsList"></div>

                <h3>Guesses <span id="wordDecodeGuessCaptionTimer"></span></h3>
                <div class="row actions word-decode-base-row">
                  <input id="wordDecodeBaseGuess" type="text" placeholder="Base word" />
                </div>
                <div id="wordDecodeGuessList"></div>
                <div class="row actions">
                  <button id="wordDecodeSubmitGuessesBtn">Submit Guesses</button>
                </div>
              </div>

              <div id="wordDecodeRoundEnd" class="hidden">
                <h3>Round Summary</h3>
                <div id="wordDecodeSummary"></div>
                <div class="row actions">
                  <button id="wordDecodeNextRoundBtn">Next Round</button>
                  <button id="wordDecodeEndGameBtn">End Game</button>
                </div>
              </div>

              <h3>Players</h3>
              <div id="wordDecodePlayers"></div>
            </template>
