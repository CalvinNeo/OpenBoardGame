<template data-game-target="yahtzeeConfigMount" data-game-mode="contents">
  <div class="game-config-card hidden" id="yahtzeeConfigBox" aria-hidden="true">
    <div class="game-config-title">Yahtzee</div>
    <div class="row">
      <label for="yahtzeeBotStrategySelect">🤖 Bot AI</label>
      <select id="yahtzeeBotStrategySelect" aria-describedby="yahtzeeBotStrategyHint">
        <option value="classic">Classic (original)</option>
        <option value="dynamic_programming">Strategic (DP)</option>
      </select>
    </div>
    <div class="hint" id="yahtzeeBotStrategyHint"></div>
  </div>
</template>
<template data-game-target="yahtzeePanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="yahtzeePhase">-</span></div>
                <div>Round: <span id="yahtzeeRound">-</span></div>
                <div>Current Turn: <span id="yahtzeeTurn">-</span></div>
              </div>
              <div class="row">
                <div>Rolls: <span id="yahtzeeRolls">-</span></div>
                <div>Winner: <span id="yahtzeeWinner">-</span></div>
              </div>

              <div id="yahtzeeJokerNotice" class="round-notice hidden">
                <div class="round-notice-title">Joker</div>
                <div id="yahtzeeJokerBody" class="round-notice-body">-</div>
              </div>

              <h3>Dice</h3>
              <div class="yahtzee-dice-container">
                <div id="yahtzeeDice" class="yahtzee-dice"></div>
                <button id="yahtzeeRollBtn">Roll</button>
              </div>

              <h3>Scorecards</h3>
              <div id="yahtzeeScorecards"></div>
            </template>
