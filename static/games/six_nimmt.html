<template data-game-target="sixNimmtHeaderActions" data-game-mode="contents">
    <button id="sixNimmtHelpBtn" type="button" aria-label="Help">Help</button>
    <button id="sixNimmtExplainBtn" type="button" aria-label="Explain" aria-pressed="false">Explain</button>
</template>
<template data-game-target="sixNimmtPanel" data-game-mode="contents">
    <div class="sn-status-bar">
        <div class="sn-progress"><span id="sixNimmtRound">ROUND —</span><span id="sixNimmtTurn">TURN — / 10</span></div>
        <span id="sixNimmtTimer" class="sn-timer" tabindex="0" data-sn-explain="timer" hidden></span>
        <span class="sn-goal" tabindex="0" data-sn-explain="score" data-sn-tip="牛头（🐮）是罚分，越少越好。有人达到 66 分后，打完本轮再结束。">🐮 <b>66</b> 终局线</span>
    </div>
    <div class="sn-notice"><span id="sixNimmtNoticeBody" role="status" aria-live="polite">Waiting to start · 2–10 players</span><span id="sixNimmtReady"></span></div>
    <div id="sixNimmtSummaryDock" class="sn-summary-dock" hidden>
        <span id="sixNimmtDockStatus"></span>
        <button id="sixNimmtShowSummaryBtn" type="button" data-sn-explain="summary">Results</button>
        <button id="sixNimmtDockNextBtn" class="sn-primary" type="button" data-sn-explain="next">Next Round</button>
    </div>
    <div id="sixNimmtResult" class="sn-result" role="status" hidden></div>
    <div id="sixNimmtTable" class="sn-layout" hidden>
        <div class="sn-play-area">
            <div id="sixNimmtPendingReveal" class="sn-pending-reveal" hidden></div>
            <section aria-labelledby="sixNimmtBoardHeading">
                <div class="sn-section-heading"><h3 id="sixNimmtBoardHeading">牌桌 <small>THE ROWS</small></h3><span tabindex="0" data-sn-explain="danger" data-sn-tip="第六张（6!）会吃掉这一行的前五张，拿走它们的全部牛头（🐮）罚分。">第 <b class="sn-danger-text">6!</b> 张吃牌</span></div>
                <div id="sixNimmtRows" class="sn-rows"></div>
            </section>
            <section id="sixNimmtHandArea" class="sn-hand-area" aria-labelledby="sixNimmtHandHeading">
                <div class="sn-section-heading"><h3 id="sixNimmtHandHeading">你的手牌 <small>YOUR HAND</small></h3><span id="sixNimmtHandCount"></span></div>
                <div id="sixNimmtHand" class="sn-hand"></div>
                <div class="sn-hand-confirm"><span id="sixNimmtSelectionHint">选择一张牌</span><button id="sixNimmtPlayBtn" class="sn-primary" type="button" data-sn-explain="play" disabled>Play Card</button></div>
            </section>
        </div>
        <aside class="sn-sidebar">
            <section aria-labelledby="sixNimmtPlayersHeading">
                <div class="sn-section-heading"><h3 id="sixNimmtPlayersHeading">计分 <small>SCORES</small></h3><span tabindex="0" data-sn-explain="score" data-sn-tip="🐮 罚分越少越好；🃏 是本轮剩余手牌；✓ 表示已锁定或已确认。">🐮 越少越好</span></div>
                <div id="sixNimmtPlayers" class="sn-players"></div>
            </section>
            <details id="sixNimmtHistory" class="sn-history" hidden><summary data-sn-explain="reveal">Reveal order <span id="sixNimmtRevealMeta"></span></summary><div id="sixNimmtReveal" class="sn-reveal"></div></details>
        </aside>
    </div>
    <dialog id="sixNimmtSummaryModal" class="sn-dialog" aria-labelledby="sixNimmtSummaryTitle">
        <div class="sn-dialog-heading"><div><span id="sixNimmtSummaryMeta" class="sn-eyebrow"></span><h2 id="sixNimmtSummaryTitle">本次揭牌</h2></div><button id="sixNimmtSummaryHideBtn" type="button">View Table</button></div>
        <div id="sixNimmtSummaryBody" class="sn-summary-body">
            <figure class="sn-placement-diagram" aria-labelledby="sixNimmtPlacementTitle">
                <figcaption class="sn-placement-heading"><h3 id="sixNimmtPlacementTitle">摆牌顺序</h3><span id="sixNimmtPlacementOrder" tabindex="0" data-sn-explain="placement"></span></figcaption>
                <div class="sn-placement-legend" tabindex="0" data-sn-explain="placement" data-sn-tip="灰色是原有牌，蓝色是本次出牌，绿色是你的牌。卡片上的 # 序号表示本次全桌的摆放顺序；虚线牌已被吃走。"><span>原有牌</span><span class="is-new">本次出牌</span><span class="is-you">你的牌</span><span class="is-taken">已吃走</span></div>
                <div id="sixNimmtPlacementRows" class="sn-placement-rows"></div>
            </figure>
            <details id="sixNimmtSummaryDetails" class="sn-summary-details"><summary>罚分明细 <span id="sixNimmtSummaryTotal"></span></summary><div id="sixNimmtSummaryList" class="sn-summary-list"></div></details>
        </div>
        <div class="sn-summary-footer"><span id="sixNimmtSummaryStatus" aria-live="polite"></span><button id="sixNimmtSummaryNextBtn" class="sn-primary" type="button" data-sn-explain="next">Next Round</button></div>
    </dialog>
    <dialog id="sixNimmtGuide" class="sn-dialog" aria-labelledby="sixNimmtGuideTitle">
        <div class="sn-dialog-heading"><h2 id="sixNimmtGuideTitle">Help</h2><button id="sixNimmtGuideClose" type="button">Close</button></div>
        <div id="sixNimmtGuideBody" class="sn-guide-body"></div>
    </dialog>
    <div id="sixNimmtTooltip" class="sn-tooltip" role="tooltip" hidden></div>
</template>
