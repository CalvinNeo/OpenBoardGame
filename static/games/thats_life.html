<template data-game-target="thatsLifeHeaderActions" data-game-mode="contents">
  <button id="thatsLifeHelpBtn" type="button">Help</button>
  <button id="thatsLifeExplainBtn" type="button" aria-pressed="false">Explain</button>
</template>
<template data-game-target="thatsLifeConfigBox" data-game-mode="contents">
  <div class="game-config-title">That's Life!</div>
  <div class="row"><label for="thatsLifeSetup">Track</label><select id="thatsLifeSetup"><option value="standard">Classic · sorted</option><option value="random">Shuffled</option></select></div>
  <div class="row"><label for="thatsLifeRounds">Rounds</label><select id="thatsLifeRounds"><option>1</option><option>2</option><option>3</option></select></div>
</template>
<template data-game-target="thatsLifePanel" data-game-mode="contents">
  <div id="thatsLifeLobby" class="tl-lobby">
    <div class="tl-lobby-art" aria-hidden="true">−8 &nbsp; 🍀 &nbsp; +8</div>
    <h3>糟了个糕！ · That's Life!</h3>
    <p>Ready up, then Start in Room Control.</p>
  </div>
  <div id="thatsLifeTable" class="hidden">
    <div class="tl-status"><div class="tl-turn"><strong id="thatsLifeStatus" role="status" aria-live="polite"></strong><span id="thatsLifeRound" data-thats-life-explain="round" tabindex="0"></span></div><span id="thatsLifeDie" data-thats-life-explain="roll" tabindex="0">🎲 —</span><button id="thatsLifeRoll" type="button" data-thats-life-explain="roll">Roll 🎲</button></div>
    <div class="tl-layout">
      <section class="tl-course" aria-label="Track">
        <div class="tl-caption"><h3>Track</h3><span data-thats-life-explain="track" tabindex="0">→ Reading order</span></div>
        <div id="thatsLifeStart" class="tl-terminal"></div>
        <div id="thatsLifeTrack" class="tl-track"></div>
        <div id="thatsLifeFinish" class="tl-terminal"></div>
        <p id="thatsLifeLastMove" class="tl-last-move" data-thats-life-explain="track" tabindex="0"></p>
      </section>
      <aside class="tl-sidebar">
        <div id="thatsLifePlayers" class="tl-players" aria-label="Players and scores"></div>
        <section id="thatsLifeSummary" class="tl-summary hidden" aria-label="Round results"><h3>Round results</h3><div id="thatsLifeResults"></div><button id="thatsLifeNext" type="button" data-thats-life-explain="next">Next Round</button></section>
        <details class="tl-log"><summary>Move history</summary><ol id="thatsLifeHistory"></ol></details>
      </aside>
    </div>
  </div>
  <dialog id="thatsLifePileDialog" class="tl-dialog"><div class="tl-caption"><h3 id="thatsLifePileTitle">Collected tiles</h3><button type="button" id="thatsLifePileClose">Close</button></div><p id="thatsLifePileScore"></p><div id="thatsLifePile" class="tl-pile"></div></dialog>
  <div id="thatsLifeTooltip" class="tl-tooltip hidden" role="tooltip"></div>
</template>
