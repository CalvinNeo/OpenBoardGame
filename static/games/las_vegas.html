<template data-game-target="lasVegasConfigBox" data-game-mode="contents">
    <div class="game-config-title">Las Vegas</div>
    <div class="row"><label for="lasVegasEdition">Edition</label><select id="lasVegasEdition" aria-describedby="lasVegasSetupHint"><option value="classic">Classic · 基础版</option><option value="royale">Royale · 豪华版</option></select></div>
    <div id="lasVegasNeutralOption" class="row toggle-row"><input id="lasVegasNeutralDice" type="checkbox"><label for="lasVegasNeutralDice">⚪ Neutral dice · 2–4 players</label></div>
    <p id="lasVegasSetupHint" class="hint">4 rounds · 8 dice each</p>
</template>
<template data-game-target="lasVegasPanel" data-game-mode="contents">
    <div id="lasVegasContent"></div>
    <dialog id="lasVegasDialog" class="lv-dialog" aria-labelledby="lasVegasDialogTitle">
        <div class="lv-dialog-heading"><h2 id="lasVegasDialogTitle">Help</h2><button id="lasVegasDialogClose" type="button">Close</button></div>
        <div id="lasVegasDialogBody" class="lv-dialog-body"></div>
    </dialog>
    <div id="lasVegasTooltip" class="lv-tooltip" role="tooltip" hidden></div>
</template>
