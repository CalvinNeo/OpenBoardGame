<template data-game-target="marrakechHeaderActions" data-game-mode="contents">
  <button id="marrakechHelpBtn" type="button">Help</button>
  <button id="marrakechExplainBtn" type="button" aria-pressed="false">Explain</button>
</template>
<template data-game-target="marrakechPanel" data-game-mode="contents">
  <div id="marrakechLobby" class="marrakech-lobby">
    <div class="marrakech-lobby-pattern" aria-hidden="true">✦ ◇ ✦ ◇ ✦</div>
    <h3>A little market. A beautiful rivalry.</h3>
    <p>Guide Assam, collect dirhams, and weave your way across the square.</p>
    <p class="marrakech-muted">2–4 players · Ready up, then Start in Room Control.</p>
  </div>
  <div id="marrakechTable" class="hidden">
    <div class="marrakech-turnline"><span id="marrakechTurn"></span><span id="marrakechPhase"></span></div>
    <div id="marrakechPlayers" class="marrakech-players" aria-label="Merchants"></div>
    <div class="marrakech-market-head">
      <h3>The rug market</h3>
      <div class="marrakech-zoom" aria-label="Board zoom">
        <button id="marrakechZoomOut" type="button" data-marrakech-explain="zoom" aria-label="Zoom out">−</button>
        <button id="marrakechZoomIn" type="button" data-marrakech-explain="zoom" aria-label="Zoom in">+</button>
        <button id="marrakechFit" type="button" data-marrakech-explain="zoom">Fit</button>
        <button id="marrakechOrigin" type="button" data-marrakech-explain="zoom">Origin</button>
      </div>
    </div>
    <div class="marrakech-market-layout">
      <div class="marrakech-board-column">
        <div id="marrakechPlacement" class="marrakech-placement hidden">
          <div class="marrakech-placement-head"><span id="marrakechRugLabel" data-marrakech-explain="place" data-marrakech-tip="place" tabindex="0"></span><span id="marrakechPlacementStep"></span></div>
          <div id="marrakechPlacementHint" class="marrakech-placement-hint" role="status" aria-live="polite"></div>
        </div>
        <div id="marrakechViewport" class="marrakech-viewport">
          <div id="marrakechWorld" class="marrakech-world">
            <svg id="marrakechRoutes" class="marrakech-routes" viewBox="0 0 800 800" aria-hidden="true"></svg>
            <div id="marrakechBoard" class="marrakech-board" role="group" aria-label="Seven by seven market"></div>
          </div>
        </div>
        <div id="marrakechSelection" class="marrakech-selection hidden">
          <div class="marrakech-confirm-row">
            <span id="marrakechSelectionLabel"></span>
            <div class="marrakech-confirm-buttons">
              <button id="marrakechPlace" class="marrakech-primary" type="button" data-marrakech-explain="place">Place rug</button>
              <button id="marrakechCancel" type="button" data-marrakech-explain="cancel">Cancel</button>
            </div>
          </div>
          <details id="marrakechAdjust" class="marrakech-adjust hidden">
            <summary>Move / rotate</summary>
            <div class="marrakech-placement-tools">
            <button type="button" data-marrakech-shift="0,-1" data-marrakech-explain="shift" aria-label="Move rug up">↑</button>
            <button type="button" data-marrakech-shift="-1,0" data-marrakech-explain="shift" aria-label="Move rug left">←</button>
            <button type="button" data-marrakech-shift="0,1" data-marrakech-explain="shift" aria-label="Move rug down">↓</button>
            <button type="button" data-marrakech-shift="1,0" data-marrakech-explain="shift" aria-label="Move rug right">→</button>
            <button id="marrakechRotate" type="button" data-marrakech-explain="rotate">Rotate ↻</button>
            </div>
          </details>
        </div>
      </div>
      <aside class="marrakech-side">
        <div id="marrakechAssamControls" class="marrakech-assam-controls">
          <h3>Guide Assam</h3>
          <div id="marrakechOrient" class="marrakech-orient"></div>
          <button id="marrakechRoll" class="marrakech-primary" type="button" data-marrakech-explain="roll">Roll die</button>
        </div>
        <div id="marrakechMessage" class="marrakech-message" role="status" aria-live="polite"></div>
        <div id="marrakechLastMove" class="marrakech-last-move" data-marrakech-explain="payment" tabindex="0" data-marrakech-tip="payment"></div>
        <div id="marrakechResults" class="marrakech-results hidden"></div>
        <details class="marrakech-journal"><summary>Market journal</summary><ol id="marrakechLog"></ol></details>
      </aside>
    </div>
  </div>
  <div id="marrakechTooltip" class="marrakech-tooltip hidden" role="tooltip"></div>
</template>
