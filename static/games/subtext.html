<template data-game-target="subtextPanel" data-game-mode="contents">
  <div class="subtext-overview">
    <div class="subtext-round-strip" aria-label="Round overview">
      <div class="subtext-round-count"><span>Round</span><strong><span id="subtextRound">-</span><span class="subtext-round-divider"> / </span><span id="subtextTotalRounds">-</span></strong></div>
      <div><span>Stage</span><strong id="subtextPhase" data-subtext-explain="phase">-</strong></div>
      <div class="subtext-dealer-name"><span>Dealer</span><strong id="subtextDealer" data-subtext-explain="dealer">-</strong></div>
    </div>
    <aside id="subtextWordCard" class="subtext-word-card hidden" data-subtext-explain="word">
      <span data-subtext-tip="Only you can see this word. Keep it secret.">🔒 Your word</span>
      <strong id="subtextYourWord">-</strong>
    </aside>
  </div>
  <div id="subtextStatus" class="subtext-status" role="status" aria-live="polite">
    <span class="subtext-status-icon" aria-hidden="true">✏️</span>
    <div id="subtextStatusBody">Waiting for game state…</div>
  </div>
  <div class="subtext-workspace">
    <section id="subtextDrawingArea" class="subtext-stage hidden" aria-label="Drawing studio">
      <div class="subtext-stage-heading"><h3>Your sketch</h3><span id="subtextDrawingCounter" class="subtext-progress-pill">0/0 ready</span></div>
      <div class="subtext-canvas-shell">
        <canvas id="subtextCanvas" width="640" height="480" aria-label="Draw your secret clue" data-subtext-explain="canvas"></canvas>
        <div id="subtextDrawingConfirm" class="subtext-inline-confirm hidden" role="group" aria-label="Confirm drawing">
          <strong>Lock this drawing?</strong><span>You cannot edit it after submitting.</span>
          <div><button id="subtextCancelDrawingBtn" type="button">Keep Drawing</button><button id="subtextConfirmDrawingBtn" class="subtext-primary-btn" type="button">Confirm</button></div>
        </div>
      </div>
      <div class="subtext-drawing-toolbar">
        <div class="subtext-tools"><button id="subtextUndoBtn" type="button" data-subtext-explain="undo">↶ Undo</button><button id="subtextResetBtn" type="button" data-subtext-explain="reset">Reset Canvas</button></div>
        <button id="subtextSubmitDrawingBtn" class="subtext-primary-btn" type="button" data-subtext-explain="submitDrawing">Submit Drawing</button>
      </div>
      <p class="subtext-drawing-warning" data-subtext-tip="Use pictures only. Keep your word and ideas to yourself until the reveal.">🤫 No letters, numbers, or discussion.</p>
      <div id="subtextDrawingSubmitted" class="subtext-submitted-note hidden">Drawing submitted ✓</div>
    </section>
    <section id="subtextGuessingArea" class="subtext-stage hidden" aria-label="Compare drawings">
      <div class="subtext-stage-heading"><h3>Find the hidden partner</h3><span id="subtextGuessCounter" class="subtext-progress-pill">0/0 voted</span></div>
      <div class="subtext-guess-layout">
        <div class="subtext-dealer-drawing">
          <div class="subtext-drawing-label"><div><span>Dealer's drawing</span><strong id="subtextDealerDrawingName">-</strong></div><button id="subtextZoomDealerBtn" class="subtext-zoom-btn" type="button" aria-label="Enlarge Dealer drawing" data-subtext-explain="zoom">Zoom</button></div>
          <canvas id="subtextDealerCanvas" width="640" height="480" aria-label="Dealer drawing" data-subtext-explain="dealer"></canvas>
        </div>
        <div id="subtextCandidateGrid" class="subtext-candidate-grid" aria-label="Anonymous drawings" tabindex="0"></div>
      </div>
      <div class="subtext-guess-actions"><span id="subtextSelectedGuess" aria-live="polite">Choose a drawing</span><button id="subtextSubmitGuessBtn" class="subtext-primary-btn" type="button" data-subtext-explain="submitGuess">Submit Guess</button></div>
    </section>
    <section id="subtextResultArea" class="subtext-stage hidden" aria-label="Round reveal">
      <div id="subtextResultBanner" class="subtext-result-banner" data-subtext-explain="scoring"></div>
      <div class="subtext-table-wrap" role="region" aria-label="Round scores" tabindex="0">
        <table class="subtext-score-table"><thead><tr><th>Player</th><th>Guess</th><th data-subtext-tip="Whether this guess found the hidden Partner's drawing.">Hit</th><th data-subtext-tip="Points earned in this round.">+Pts</th><th data-subtext-tip="Cumulative points across all completed rounds.">Total</th></tr></thead><tbody id="subtextResultTableBody"></tbody></table>
      </div>
      <details class="subtext-reveal-gallery" open><summary>Round drawings</summary><div id="subtextResultDrawings" class="subtext-result-grid"></div></details>
      <div id="subtextNextRoundRow" class="subtext-next-row"><span id="subtextReadyStatus">Ready 0/0</span><button id="subtextNextRoundBtn" class="subtext-primary-btn" type="button" data-subtext-explain="nextRound">Next Round</button></div>
      <div id="subtextGameOverActions" class="subtext-next-row hidden"><div><span id="subtextWinnerText">-</span><div id="subtextPlayAgainStatus" aria-live="polite">Ready 0/0</div></div><button id="subtextPlayAgainBtn" class="subtext-primary-btn" type="button" data-subtext-explain="playAgain">Ready</button></div>
    </section>
    <details class="subtext-scoreboard"><summary><span>Players &amp; scores</span><span id="subtextPlayerCount" class="subtext-player-count"></span></summary><div id="subtextPlayers" class="subtext-player-grid" data-subtext-explain="players"></div></details>
  </div>
  <div id="subtextTooltip" class="subtext-tooltip hidden" role="tooltip"></div>
  <dialog id="subtextPreviewDialog" class="subtext-preview-dialog" aria-labelledby="subtextPreviewTitle">
    <div class="subtext-preview-header"><h3 id="subtextPreviewTitle">Drawing</h3><button id="subtextPreviewCloseBtn" type="button">Close</button></div>
    <canvas id="subtextPreviewCanvas" width="640" height="480" aria-label="Enlarged drawing"></canvas>
  </dialog>
</template>
