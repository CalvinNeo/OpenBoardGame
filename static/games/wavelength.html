<template data-game-target="wavelengthHelpModal" data-game-mode="replace">
  <section id="wavelengthHelpModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="wavelengthHelpTitle">
    <div class="modal-content wavelength-modal-card">
      <div class="modal-header">
        <h2 id="wavelengthHelpTitle">Wavelength · How to play</h2>
        <button id="wavelengthHelpModalCloseBtn" class="wavelength-modal-close" type="button" aria-label="Close help">Close</button>
      </div>
      <div class="modal-body wavelength-help-content" id="wavelengthHelpContent"></div>
    </div>
  </section>
</template>

<template data-game-target="wavelengthExplainModal" data-game-mode="replace">
  <section id="wavelengthExplainModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="wavelengthExplainTitle">
    <div class="modal-content wavelength-modal-card">
      <div class="modal-header">
        <h2 id="wavelengthExplainTitle">Wavelength · Explain</h2>
        <button id="wavelengthExplainModalCloseBtn" class="wavelength-modal-close" type="button" aria-label="Close explanation">Close</button>
      </div>
      <div class="modal-body">
        <div id="wavelengthExplainContent"></div>
      </div>
    </div>
  </section>
</template>

<template data-game-target="wavelengthPanel" data-game-mode="contents">
  <div id="wavelengthScene" class="wavelength-scene">
    <div class="wavelength-statusbar" role="status" aria-live="polite" data-wavelength-explain="phase">
      <div class="wavelength-status-heading">
        <span class="wavelength-eyebrow">Wavelength</span>
        <span class="wavelength-status-phase" id="wavelengthPhase">Waiting</span>
        <span class="wavelength-status-round">Round <strong id="wavelengthRound">—</strong></span>
      </div>
      <div id="wavelengthStatusBody" class="wavelength-status-body">Choose a team to begin.</div>
    </div>

    <div class="wavelength-layout">
      <main class="wavelength-board" aria-label="Wavelength game board">
        <section class="wavelength-wheel-card" data-wavelength-explain="dial">
          <div class="wavelength-wheel-header">
            <div data-wavelength-explain="spectrum">
              <span class="wavelength-eyebrow" data-wavelength-tip="Target (🎯) is hidden until the reveal">🎯 Target dial</span>
              <h3>Find the frequency</h3>
            </div>
            <span id="wavelengthTarget" class="wavelength-target-badge" data-wavelength-explain="target">Target hidden</span>
          </div>
          <div class="wavelength-clue-readout" data-wavelength-explain="clue">
            <span class="wavelength-clue-label">Clue</span>
            <span id="wavelengthClue">Waiting for the psychic…</span>
          </div>
          <div class="wavelength-compatibility-fields" aria-hidden="true">
            <span id="wavelengthSpectrumCard"><span id="wavelengthCard">—</span></span>
            <span id="wavelengthClueInfoCard">—</span>
            <span id="wavelengthTargetInfoCard">—</span>
          </div>

          <div id="wavelengthDial" class="wavelength-dial" role="slider" tabindex="-1" aria-label="Wavelength dial position" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-valuetext="Center" data-wavelength-explain="dial">
            <svg id="wavelengthDialSvg" viewBox="0 0 600 340" role="img" aria-labelledby="wavelengthDialTitle wavelengthDialDesc">
              <title id="wavelengthDialTitle">Semicircular Wavelength dial</title>
              <desc id="wavelengthDialDesc">A red needle rotates across the spectrum. The target and score zones may be revealed during scoring.</desc>
              <defs>
                <linearGradient id="wavelengthWheelFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#fffaf0" />
                  <stop offset="1" stop-color="#e9e0d1" />
                </linearGradient>
                <filter id="wavelengthWheelShadow" x="-20%" y="-20%" width="140%" height="160%">
                  <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#143c3a" flood-opacity=".17" />
                </filter>
              </defs>
              <path class="wavelength-wheel-back" d="M50 290 A250 250 0 0 1 550 290 L50 290 Z" fill="url(#wavelengthWheelFill)" filter="url(#wavelengthWheelShadow)" />
              <path class="wavelength-wheel-rim" d="M50 290 A250 250 0 0 1 550 290" fill="none" />
              <g id="wavelengthScoreZones" aria-hidden="true"></g>
              <g id="wavelengthDialTicks" aria-hidden="true"></g>
              <g id="wavelengthTargetMarker" class="wavelength-target-marker is-hidden-target" aria-hidden="true">
                <circle cx="300" cy="88" r="12" />
                <path d="M300 66v-17M292 53h16" />
              </g>
              <g id="wavelengthNeedle" aria-hidden="true">
                <line x1="300" y1="288" x2="300" y2="56" />
                <circle cx="300" cy="290" r="23" class="wavelength-needle-hub" />
                <circle cx="300" cy="290" r="8" class="wavelength-needle-pin" />
              </g>
            </svg>
            <div class="wavelength-pole wavelength-pole-left"><span id="wavelengthLeftLabel">Cold</span></div>
            <div class="wavelength-pole wavelength-pole-right"><span id="wavelengthRightLabel">Hot</span></div>
          </div>
          <div id="wavelengthDialHint" class="wavelength-dial-hint">The team dial is locked until your turn. Drag the red needle when it is your turn.</div>
          <output id="wavelengthGuessValue" class="wavelength-guess-value" aria-live="polite">Center · 0.00</output>

          <!-- Kept for clients that still query the former linear track while upgrading. -->
          <div class="wavelength-legacy-track" aria-hidden="true">
            <div id="wavelengthTrack" class="wavelength-track">
              <div id="wavelengthZone2" class="wavelength-zone zone2"></div>
              <div id="wavelengthZone3" class="wavelength-zone zone3"></div>
              <div id="wavelengthZone4" class="wavelength-zone zone4"></div>
              <div id="wavelengthLabel2" class="wavelength-zone-label">2 pts</div>
              <div id="wavelengthLabel3" class="wavelength-zone-label">3 pts</div>
              <div id="wavelengthLabel4" class="wavelength-zone-label">4 pts</div>
              <div id="wavelengthTrackTarget" class="wavelength-marker target"></div>
              <div id="wavelengthTrackGuess" class="wavelength-marker guess"></div>
            </div>
          </div>
        </section>

        <section id="wavelengthRecap" class="wavelength-recap hidden" aria-labelledby="wavelengthRecapTitle">
          <div class="wavelength-recap-heading">
            <div>
              <span class="wavelength-eyebrow">Round complete</span>
              <h3 id="wavelengthRecapTitle">The frequency was revealed</h3>
            </div>
            <span class="wavelength-recap-mark">✦</span>
          </div>
          <div id="wavelengthRecapScores" class="wavelength-recap-scores" data-wavelength-explain="score"></div>
          <p id="wavelengthRecapDetail" class="wavelength-recap-detail">Review the dial and score before continuing.</p>
          <section id="wavelengthContinueCard" class="wavelength-action-card wavelength-continue-card" data-wavelength-explain="continue_next_round">
            <div class="wavelength-action-title"><span>⏭️</span> Ready for the next round?</div>
            <div class="wavelength-action-copy" id="wavelengthContinueCardCopy">Every player confirms before the next round starts.</div>
            <div class="wavelength-continue-row">
              <button id="wavelengthContinueBtn" type="button" data-wavelength-explain="continue_next_round">Next Round</button>
              <span id="wavelengthContinueProgress" class="wavelength-continue-progress">0 / 0 ready</span>
            </div>
          </section>
        </section>

        <section class="wavelength-actions" aria-label="Round actions">
          <section id="wavelengthClueCard" class="wavelength-action-card" data-wavelength-explain="clue">
            <div class="wavelength-action-title"><span data-wavelength-tip="Psychic (🔮) sees the hidden target">🔮</span> Psychic clue</div>
            <div class="wavelength-action-copy" id="wavelengthClueCardCopy">Give your team one short clue for the hidden target.</div>
            <label for="wavelengthClueInput">Your clue</label>
            <div class="wavelength-inline-form">
              <input id="wavelengthClueInput" type="text" maxlength="80" placeholder="Type one clue" autocomplete="off" />
              <button id="wavelengthSubmitClueBtn" type="button" data-wavelength-explain="submit_clue">Submit clue</button>
            </div>
          </section>

          <section id="wavelengthGuessCard" class="wavelength-action-card" data-wavelength-explain="submit_team_guess">
            <div class="wavelength-action-title"><span data-wavelength-tip="Team dial (🧭) is the red needle">🧭</span> Team dial</div>
            <div class="wavelength-action-copy" id="wavelengthGuessCardCopy">Discuss the clue, place the needle, then lock your guess.</div>
            <div class="wavelength-guess-controls">
              <output class="wavelength-guess-pill" aria-label="Current dial position">Dial <span id="wavelengthGuessValueMirror">0.00</span></output>
              <div class="wavelength-nudge-row" role="group" aria-label="Fine dial adjustment">
                <button id="wavelengthNudgeLeftBtn" type="button" data-wavelength-explain="nudge" data-wavelength-tip="Nudge the dial a little left">◀</button>
                <button id="wavelengthNudgeRightBtn" type="button" data-wavelength-explain="nudge" data-wavelength-tip="Nudge the dial a little right">▶</button>
              </div>
            </div>
            <button id="wavelengthSubmitGuessBtn" class="wavelength-primary-action" type="button" data-wavelength-explain="submit_team_guess">Lock team guess</button>
          </section>

          <section id="wavelengthSideCard" class="wavelength-action-card" data-wavelength-explain="submit_side_guess">
            <div class="wavelength-action-title"><span data-wavelength-tip="Opponent chooses a side after the team locks">🕵️</span> Opponent side guess</div>
            <div class="wavelength-action-copy" id="wavelengthSideCardCopy">Is the hidden target to the left or right of the needle?</div>
            <div class="wavelength-side-actions">
              <button id="wavelengthSideLeftBtn" type="button" data-wavelength-explain="submit_side_guess">⬅️ Left</button>
              <button id="wavelengthSideRightBtn" type="button" data-wavelength-explain="submit_side_guess">Right ➡️</button>
            </div>
          </section>
        </section>
      </main>

      <aside id="wavelengthSidebar" class="wavelength-sidebar" aria-label="Round details">
        <section class="wavelength-sidebar-card wavelength-scoreboard" data-wavelength-explain="score">
          <div class="wavelength-card-heading"><span data-wavelength-tip="Scoreboard shows Team A (🔵) and Team B (🟠)">🏆 Scoreboard</span><span class="wavelength-card-kicker">Now</span></div>
          <div id="wavelengthScores" class="wavelength-scores"></div>
        </section>
        <section class="wavelength-sidebar-card wavelength-you-card" data-wavelength-explain="role">
          <div class="wavelength-card-heading"><span data-wavelength-tip="Your team and role for this round">🎲 You</span><span class="wavelength-card-kicker">In this round</span></div>
          <dl class="wavelength-you-details">
            <div><dt>Team</dt><dd id="wavelengthYourTeam">—</dd></div>
            <div><dt>Role</dt><dd id="wavelengthYourRole">—</dd></div>
          </dl>
        </section>
        <details class="wavelength-sidebar-card wavelength-details" data-wavelength-explain="players">
          <summary>👥 Players</summary>
          <div id="wavelengthPlayers" class="wavelength-scroll-list"></div>
        </details>
        <details class="wavelength-sidebar-card wavelength-details" data-wavelength-explain="history">
          <summary>🕘 Previous round</summary>
          <div id="wavelengthHistory" class="wavelength-scroll-list"></div>
        </details>
      </aside>
    </div>
    <div id="wavelengthTooltip" class="wavelength-tooltip" role="tooltip" hidden></div>
  </div>
</template>
