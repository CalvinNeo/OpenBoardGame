<template data-game-target="projectLUpgradeModal" data-game-mode="replace">
    <section id="projectLUpgradeModal" class="modal hidden project-l-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="projectLUpgradeTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="projectLUpgradeTitle">Upgrade a piece · 1 AP</h2>
                <button id="projectLUpgradeModalCloseBtn" type="button" data-project-l-explain="dialog_close">Close</button>
            </div>
            <div class="modal-body">
                <div id="projectLUpgradeFromLabel"></div>
                <div id="projectLUpgradeOptions" class="project-l-upgrade-options"></div>
            </div>
        </div>
    </section>
</template>
<template data-game-target="projectLPanel" data-game-mode="contents">
    <div class="project-l-status" aria-live="polite">
        <strong id="projectLTurn">Waiting for players</strong>
        <span id="projectLPhase" class="project-l-pill">Main</span>
        <span class="project-l-pill" data-project-l-explain="ap" data-project-l-tip="Action points (AP): spend up to 3 on your turn." tabindex="0">⚡ <span id="projectLAp">–</span> AP</span>
        <span class="project-l-pill" data-project-l-explain="master_action" data-project-l-tip="Master Action (✦): one piece per puzzle for 1 AP, once per turn." tabindex="0">✦ <span id="projectLMasterUsed">Ready</span></span>
    </div>
    <div id="projectLEndTriggered" class="project-l-notice hidden">Final round · the black deck is empty.</div>
    <div id="projectLWinner" class="project-l-result hidden" role="status"></div>
    <div class="project-l-layout">
        <section class="project-l-workspace" aria-label="Your workbench">
            <div class="project-l-section-heading">
                <h3>Your pieces</h3>
                <div class="project-l-actions">
                    <button id="projectLUpgradeBtn" type="button">Upgrade ↑</button>
                    <button id="projectLTakeLevel1Btn" type="button">+ Lv 1</button>
                </div>
            </div>
            <div id="projectLInventory" class="project-l-inventory" aria-label="Piece inventory"></div>
            <div class="project-l-section-heading project-l-tools">
                <div class="project-l-piece-preview">
                    <div id="projectLSelectedPiecePreview" aria-hidden="true"></div>
                    <span id="projectLSelectedPiece">Choose a piece</span>
                </div>
                <div class="project-l-actions">
                    <button id="projectLRotateLeftBtn" type="button" aria-label="Rotate left 90 degrees">↶</button>
                    <button id="projectLRotateRightBtn" type="button" aria-label="Rotate right 90 degrees">↷</button>
                    <button id="projectLFlipBtn" type="button" aria-label="Flip piece horizontally" aria-pressed="false">↔</button>
                </div>
            </div>
            <div class="project-l-section-heading">
                <h3>Your puzzles</h3>
                <span id="projectLPuzzleCount" class="project-l-muted" data-project-l-explain="puzzle_limit" data-project-l-tip="You can work on up to 4 puzzles at once." tabindex="0">0 / 4</span>
            </div>
            <div id="projectLActivePuzzles" class="project-l-puzzle-list"></div>
            <section id="projectLMasterSection" class="project-l-master-section hidden" aria-label="Master Action plan">
                <div class="project-l-section-heading">
                    <h3>✦ Master plan</h3>
                    <button id="projectLUseMasterBtn" type="button">Use Master · 1 AP</button>
                </div>
                <div id="projectLMasterQueue" class="project-l-master-queue"></div>
            </section>
            <div id="projectLFinishingActions" class="project-l-finishing hidden">
                <span>Finishing touches · −1 point per piece</span>
                <button id="projectLFinishingDoneBtn" type="button">Finish</button>
            </div>
        </section>
        <section class="project-l-market" aria-label="Puzzle market">
            <h3>Puzzle market</h3>
            <div class="project-l-market-section">
                <div class="project-l-section-heading">
                    <span data-project-l-explain="white_deck" data-project-l-tip="White puzzles (⚪): easier puzzles to build your inventory." tabindex="0">⚪ White</span>
                    <button id="projectLDrawWhiteBtn" type="button">Draw · <span id="projectLWhiteRemaining">–</span> left</button>
                </div>
                <div id="projectLMarketWhite" class="project-l-market-grid"></div>
            </div>
            <div class="project-l-market-section">
                <div class="project-l-section-heading">
                    <span data-project-l-explain="black_deck" data-project-l-tip="Black puzzles (⚫): harder puzzles worth more points. An empty black deck triggers the final round." tabindex="0">⚫ Black</span>
                    <button id="projectLDrawBlackBtn" type="button">Draw · <span id="projectLBlackRemaining">–</span> left</button>
                </div>
                <div id="projectLMarketBlack" class="project-l-market-grid"></div>
            </div>
        </section>
    </div>
    <div class="project-l-secondary">
        <details class="project-l-details" open>
            <summary>Players <span id="projectLPlayerCount"></span></summary>
            <div id="projectLPlayers" class="project-l-players"></div>
        </details>
        <details class="project-l-details">
            <summary>Completed <span id="projectLCompletedCount">0</span></summary>
            <div id="projectLCompletedPuzzles" class="project-l-completed"></div>
        </details>
    </div>
    <div id="projectLSelectionHome" class="hidden">
        <div id="projectLMarketConfirmation" class="project-l-market-confirmation">
            <strong id="projectLSelectedMarket"></strong>
            <button id="projectLTakeMarketBtn" type="button">Take · 1 AP</button>
            <button id="projectLCancelMarketBtn" type="button">Cancel</button>
        </div>
        <div id="projectLPlacementConfirmation" class="project-l-placement-confirmation">
            <span id="projectLPlacementHint" role="status"></span>
            <div class="project-l-actions project-l-inline-tools">
                <button id="projectLPlacementRotateLeftBtn" type="button" aria-label="Rotate preview left 90 degrees">↶</button>
                <button id="projectLPlacementRotateRightBtn" type="button" aria-label="Rotate preview right 90 degrees">↷</button>
                <button id="projectLPlacementFlipBtn" type="button" aria-label="Flip preview horizontally" aria-pressed="false">↔</button>
            </div>
            <button id="projectLPlaceBtn" type="button">Place · 1 AP</button>
            <button id="projectLQueueMasterBtn" type="button">+ Master plan</button>
            <button id="projectLFinishingPlaceBtn" type="button">Place · −1 point</button>
            <button id="projectLCancelPlacementBtn" type="button">Cancel</button>
        </div>
    </div>
    <div id="projectLTooltip" class="project-l-tooltip hidden" role="tooltip"></div>
</template>
