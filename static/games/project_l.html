<template data-game-target="projectLUpgradeModal" data-game-mode="replace"><section id="projectLUpgradeModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Select Upgrade Target</h2>
        <button id="projectLUpgradeModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="projectLUpgradeFromLabel" class="hint"></div>
        <div id="projectLUpgradeOptions" class="project-l-upgrade-options"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="projectLHelpModal" data-game-mode="replace"><section id="projectLHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content project-l-help-modal">
      <div class="modal-header">
        <h2>Project L - Game Rules</h2>
        <button id="projectLHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body project-l-help-content"></div>
    </div>
  </section></template>
<template data-game-target="projectLExplainModal" data-game-mode="replace"><section id="projectLExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content project-l-explain-modal">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="projectLExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="projectLExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="projectLPanel" data-game-mode="contents">
              <div class="row">
                <div>Phase: <span id="projectLPhase">-</span></div>
                <div>AP: <span id="projectLAp">-</span></div>
                <div>Current Turn: <span id="projectLTurn">-</span></div>
                <div>Master Used: <span id="projectLMasterUsed">-</span></div>
              </div>
              <div class="row">
                <div>White Deck: <span id="projectLWhiteRemaining">-</span></div>
                <div>Black Deck: <span id="projectLBlackRemaining">-</span></div>
                <div>End Triggered: <span id="projectLEndTriggered">-</span></div>
                <div>Winner: <span id="projectLWinner">-</span></div>
              </div>
              <div class="row">
                <div>Selected Market: <span id="projectLSelectedMarket">-</span></div>
                <div>Selected Puzzle: <span id="projectLSelectedPuzzle">-</span></div>
                <div>Selected Piece: <span id="projectLSelectedPiece">-</span></div>
                <div>Origin: <span id="projectLSelectedOrigin">-</span></div>
                <div>Rotation: <span id="projectLSelectedRotation">0</span></div>
                <div>Flip: <span id="projectLSelectedFlip">No</span></div>
              </div>
              <div class="project-l-layout">
                <div>
                  <h3>Market 🧩</h3>
                  <div class="project-l-market-section">
                    <div class="project-l-market-title">White Market ⚪</div>
                    <div id="projectLMarketWhite" class="project-l-market-grid"></div>
                  </div>
                  <div class="project-l-market-section">
                    <div class="project-l-market-title">Black Market ⚫</div>
                    <div id="projectLMarketBlack" class="project-l-market-grid"></div>
                  </div>
                  <div class="row actions">
                    <button id="projectLTakeMarketBtn">Take Selected Market</button>
                    <button id="projectLDrawWhiteBtn">Draw White Deck</button>
                    <button id="projectLDrawBlackBtn">Draw Black Deck</button>
                  </div>
                </div>
                <div>
                  <div class="row actions project-l-rotate-actions">
                    <button id="projectLRotateLeftBtn">Rotate Left</button>
                    <button id="projectLRotateRightBtn">Rotate Right</button>
                    <button id="projectLFlipBtn">Flip</button>
                  </div>
                  <h3>Active Puzzles 🧩</h3>
                  <div id="projectLActivePuzzles" class="project-l-puzzle-list"></div>
                  <h3>Completed ✅</h3>
                  <div id="projectLCompletedPuzzles" class="project-l-completed"></div>
                </div>
                <div>
                  <h3>Inventory 🎒</h3>
                  <div id="projectLInventory" class="project-l-inventory"></div>
                  <div class="row actions project-l-inventory-actions">
                    <button id="projectLUpgradeBtn">Upgrade</button>
                    <button id="projectLTakeLevel1Btn">Take Level 1</button>
                  </div>
                  <h3>Placement 🧱</h3>
                  <div class="row actions">
                    <button id="projectLPlaceBtn">Place Piece</button>
                    <button id="projectLQueueMasterBtn">Queue Master</button>
                    <button id="projectLClearMasterBtn">Clear Queue</button>
                    <button id="projectLUseMasterBtn">Use Master</button>
                  </div>
                  <div id="projectLMasterQueue" class="project-l-master-queue"></div>
                  <h3>Finishing 🏁</h3>
                  <div class="row actions">
                    <button id="projectLFinishingPlaceBtn">Finishing Place</button>
                    <button id="projectLFinishingDoneBtn">Finish</button>
                  </div>
                  <h3>Players 👥</h3>
                  <div id="projectLPlayers"></div>
                </div>
              </div>
            </template>
