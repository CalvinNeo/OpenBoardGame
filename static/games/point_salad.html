<template data-game-target="pointSaladHelpModal" data-game-mode="replace"><section id="pointSaladHelpModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content point-salad-help-modal">
      <div class="modal-header">
        <h2>Point Salad - Game Rules</h2>
        <button id="pointSaladHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body point-salad-help-content" id="pointSaladHelpContent"></div>
    </div>
  </section></template>
<template data-game-target="pointSaladExplainModal" data-game-mode="replace"><section id="pointSaladExplainModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content point-salad-explain-modal">
      <div class="modal-header">
        <h2>Button Explanation</h2>
        <button id="pointSaladExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body">
        <div id="pointSaladExplainContent"></div>
      </div>
    </div>
  </section></template>
<template data-game-target="pointSaladPanel" data-game-mode="contents">
              <div class="row">
                <div>Current Turn: <span id="pointSaladTurn">-</span></div>
                <div>Winner: <span id="pointSaladWinner">-</span></div>
              </div>

              <h3>Piles</h3>
              <div id="pointSaladPiles" class="point-salad-piles"></div>

              <h3>Market</h3>
              <div id="pointSaladMarket" class="point-salad-market"></div>

              <h3>Selection</h3>
              <div class="row">
                <div>Pile: <span id="pointSaladSelectedPile">-</span></div>
                <div>Veggies: <span id="pointSaladSelectedVeggies">-</span></div>
                <div>Flips: <span id="pointSaladSelectedFlips">-</span></div>
              </div>
              <div class="row actions">
                <button id="pointSaladClearSelectionBtn">Clear Selection</button>
                <button id="pointSaladClearFlipsBtn">Clear Flips</button>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <button id="pointSaladTakePointBtn">Take Point Card</button>
                <button id="pointSaladTakeVeggiesBtn">Take Veggies</button>
              </div>

              <h3>Players</h3>
              <div id="pointSaladPlayers"></div>
            </template>
