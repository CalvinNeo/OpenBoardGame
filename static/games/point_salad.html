<template data-game-target="pointSaladHelpModal" data-game-mode="replace">
  <section id="pointSaladHelpModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pointSaladHelpTitle">
    <div class="modal-content point-salad-help-modal">
      <div class="modal-header">
        <h2 id="pointSaladHelpTitle">🥗 Point Salad · Help</h2>
        <button id="pointSaladHelpModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body point-salad-help-content" id="pointSaladHelpContent" tabindex="0"></div>
    </div>
  </section>
</template>
<template data-game-target="pointSaladExplainModal" data-game-mode="replace">
  <section id="pointSaladExplainModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pointSaladExplainTitle">
    <div class="modal-content point-salad-explain-modal">
      <div class="modal-header">
        <h2 id="pointSaladExplainTitle">Explain</h2>
        <button id="pointSaladExplainModalCloseBtn" type="button">Close</button>
      </div>
      <div class="modal-body" id="pointSaladExplainContent" tabindex="0"></div>
    </div>
  </section>
</template>
<template data-game-target="pointSaladPanel" data-game-mode="contents">
  <div class="point-salad-status" id="pointSaladStatus" aria-live="polite">
    <div class="point-salad-turn">
      <span class="point-salad-status-icon" aria-hidden="true">🥗</span>
      <div><span class="point-salad-eyebrow" id="pointSaladPhase">Fresh from the market</span><strong id="pointSaladTurn">Waiting for players</strong></div>
    </div>
    <span id="pointSaladRemaining" class="point-salad-counter" data-point-salad-explain="remaining" tabindex="0"></span>
  </div>
  <div id="pointSaladWinner" class="point-salad-winner hidden" role="status"></div>
  <div id="pointSaladExplainHint" class="point-salad-explain-hint hidden" role="status">Select a highlighted item to learn more. Esc to exit.</div>

  <div class="point-salad-workspace" id="pointSaladWorkspace">
    <section class="point-salad-market-panel" aria-labelledby="pointSaladMarketTitle">
      <div class="point-salad-section-heading">
        <h3 id="pointSaladMarketTitle">The market</h3>
        <span class="point-salad-eyebrow">Pick one option</span>
      </div>
      <div class="point-salad-shelf-heading" data-point-salad-explain="piles"><h4>Point cards</h4><span>Take 1</span></div>
      <div id="pointSaladPiles" class="point-salad-piles" aria-label="Point card piles"></div>
      <div class="point-salad-shelf-heading" data-point-salad-explain="market"><h4>Veggie market</h4><span id="pointSaladMarketCount">Take 2</span></div>
      <div id="pointSaladMarket" class="point-salad-market" aria-label="Veggie market"></div>
      <div class="point-salad-action-tray">
        <div class="point-salad-selection" aria-live="polite">
          <strong id="pointSaladSelection">Choose a point card or 2 veggies</strong>
          <span id="pointSaladSelectedFlips" class="hidden"></span>
        </div>
        <div class="point-salad-actions">
          <button id="pointSaladTakePointBtn" type="button" data-point-salad-explain="takePoint" disabled>Take point card</button>
          <button id="pointSaladTakeVeggiesBtn" type="button" data-point-salad-explain="takeVeggies" disabled>Take 2 veggies</button>
        </div>
      </div>
    </section>

    <section class="point-salad-own-panel" id="pointSaladOwnPanel" aria-labelledby="pointSaladOwnTitle">
      <div class="point-salad-section-heading">
        <h3 id="pointSaladOwnTitle">Your salad</h3>
        <span id="pointSaladOwnScore" class="point-salad-score" data-point-salad-explain="score" tabindex="0">0 pts</span>
      </div>
      <div id="pointSaladOwnVeggies" class="point-salad-veggie-counts" aria-label="Your veggie collection"></div>
      <div class="point-salad-shelf-heading"><h4>Scoring cards <span id="pointSaladOwnCardCount"></span></h4><span id="pointSaladFlipHint">Select to flip</span></div>
      <div id="pointSaladOwnCards" class="point-salad-card-list" aria-label="Your scoring cards"></div>
    </section>
  </div>

  <section class="point-salad-table" aria-labelledby="pointSaladPlayersTitle">
    <div class="point-salad-section-heading"><h3 id="pointSaladPlayersTitle">Around the table</h3><span id="pointSaladPlayerCount" class="point-salad-eyebrow"></span></div>
    <div id="pointSaladPlayers" class="point-salad-players"></div>
  </section>
  <div id="pointSaladTooltip" class="point-salad-tooltip hidden" role="tooltip"></div>
</template>
