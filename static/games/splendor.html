<template data-game-target="splendorPanel" data-game-mode="contents">
              <div class="splendor-toolbar">
                <h3>💎 Splendor</h3>
                <div class="splendor-tools">
                  <button id="splendorHelpBtn" type="button">Help</button>
                  <button id="splendorExplainBtn" type="button" aria-pressed="false">Explain</button>
                </div>
              </div>
              <div class="row">
                <div data-splendor-explain="phase">Phase: <span id="splendorPhase">-</span></div>
                <div data-splendor-explain="turn">Current Turn: <span id="splendorTurn">-</span></div>
                <div data-splendor-explain="final_round">Final Round: <span id="splendorFinalRound">-</span></div>
              </div>
              <div class="row">
                <div data-splendor-explain="winner">Winner: <span id="splendorWinner">-</span></div>
              </div>

              <h3>Token Supply</h3>
              <div id="splendorSupply" class="splendor-token-row" data-splendor-explain="supply"></div>

              <h3>Market</h3>
              <div class="splendor-market">
                <div class="splendor-tier">
                  <div class="tier-label">Tier 3</div>
                  <div id="splendorMarketTier3" class="splendor-cards" data-splendor-explain="market_tier3"></div>
                </div>
                <div class="splendor-tier">
                  <div class="tier-label">Tier 2</div>
                  <div id="splendorMarketTier2" class="splendor-cards" data-splendor-explain="market_tier2"></div>
                </div>
                <div class="splendor-tier">
                  <div class="tier-label">Tier 1</div>
                  <div id="splendorMarketTier1" class="splendor-cards" data-splendor-explain="market_tier1"></div>
                </div>
              </div>

              <h3>Nobles</h3>
              <div id="splendorNobles" class="splendor-cards" data-splendor-explain="nobles"></div>

              <h3>Your Selection</h3>
              <div class="row">
                <div data-splendor-explain="selected_market">Market: <span id="splendorSelectedMarket">-</span></div>
                <div data-splendor-explain="selected_reserved">Reserved: <span id="splendorSelectedReserved">-</span></div>
                <div data-splendor-explain="selected_noble">Noble: <span id="splendorSelectedNoble">-</span></div>
                <button id="splendorClearSelection" data-splendor-explain="clear">Clear</button>
              </div>
              <div class="row">
                <label for="splendorReserveTier" data-splendor-explain="reserve_tier">Reserve Deck Tier</label>
                <select id="splendorReserveTier" data-splendor-explain="reserve_tier">
                  <option value="tier1">Tier 1</option>
                  <option value="tier2">Tier 2</option>
                  <option value="tier3">Tier 3</option>
                </select>
              </div>
              <div class="row">
                <div data-splendor-explain="token_selection">Token Selection</div>
                <div id="splendorTokenSelection" class="splendor-token-selection" data-splendor-explain="token_selection"></div>
              </div>
              <div id="splendorDiscardSelectionRow" class="row hidden">
                <div data-splendor-explain="discard_selection">Discard Selection</div>
                <div id="splendorDiscardSelection" class="splendor-token-selection" data-splendor-explain="discard_selection"></div>
              </div>
              <div id="splendorDiscardHint" class="splendor-discard-hint hidden" data-splendor-explain="discard_hint"></div>

              <h3>Actions</h3>
              <div class="row actions">
                <button id="splendorTakeThreeBtn" data-splendor-explain="take_three">Take 3 Different</button>
                <button id="splendorTakeTwoBtn" data-splendor-explain="take_two">Take 2 Same</button>
                <button id="splendorReserveMarketBtn" data-splendor-explain="reserve_market">Reserve Market</button>
                <button id="splendorReserveDeckBtn" data-splendor-explain="reserve_deck">Reserve Deck</button>
                <button id="splendorBuyMarketBtn" data-splendor-explain="buy_market">Buy Market</button>
                <button id="splendorBuyReservedBtn" data-splendor-explain="buy_reserved">Buy Reserved</button>
                <button id="splendorDiscardBtn" data-splendor-explain="discard_tokens">Discard Tokens</button>
                <button id="splendorChooseNobleBtn" data-splendor-explain="choose_noble">Choose Noble</button>
              </div>

              <h3>Your Reserved</h3>
              <div id="splendorReserved" class="splendor-cards" data-splendor-explain="reserved"></div>

              <h3>Players</h3>
              <div id="splendorPlayers" data-splendor-explain="players"></div>
            </template>
