<template data-game-target="hanabiPanel" data-game-mode="contents">
              <div class="row">
                <div>Current Turn: <span id="hanabiTurn">-</span></div>
                <div>Clues: <span id="hanabiClues">-</span></div>
                <div>Fuses: <span id="hanabiFuses">-</span></div>
                <div>Deck: <span id="hanabiDeck">-</span></div>
              </div>
              <div class="row">
                <div>Score: <span id="hanabiScore">-</span></div>
                <div>Final Turns: <span id="hanabiFinalTurns">-</span></div>
                <div>End: <span id="hanabiEndReason">-</span></div>
              </div>

              <h3>Tableau</h3>
              <div id="hanabiTableau" class="hanabi-tableau"></div>

              <h3>Discard Stats</h3>
              <div id="hanabiDiscardStats" class="hanabi-discard-stats"></div>

              <h3>Your Hand</h3>
              <div id="hanabiHand" class="hand"></div>
              <div class="row">
                <div>Selected Card: <span id="hanabiSelectedCard">-</span></div>
                <button id="hanabiClearSelection">Clear</button>
              </div>

              <h3>Actions</h3>
              <div class="row actions">
                <button id="hanabiPlayBtn">Play</button>
                <button id="hanabiDiscardBtn">Discard</button>
              </div>
              <div class="row actions mobile-field-grid">
                <label for="hanabiTargetSelect">Clue Target</label>
                <select id="hanabiTargetSelect"></select>
                <label>Clue Type</label>
                <div id="hanabiClueTypeGroup" class="hanabi-radio-group">
                  <label class="hanabi-radio">
                    <input type="radio" name="hanabiClueType" value="color" checked />
                    <span>Color</span>
                  </label>
                  <label class="hanabi-radio">
                    <input type="radio" name="hanabiClueType" value="rank" />
                    <span>Number</span>
                  </label>
                </div>
                <label>Value</label>
                <div id="hanabiClueValueGroup" class="hanabi-radio-group"></div>
                <button id="hanabiClueBtn">Give Clue</button>
              </div>

              <h3>Players</h3>
              <div id="hanabiPlayers"></div>

              <h3>Game Log</h3>
              <div id="hanabiLog" class="hanabi-log"></div>
            </template>
