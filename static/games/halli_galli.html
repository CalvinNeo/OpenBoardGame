<template data-game-target="halliPanel" data-game-mode="contents">
              <div class="halli-toolbar">
                <h3>🔔 Halli Galli</h3>
                <div class="halli-tools">
                  <button id="halliHelpBtn" type="button">Help</button>
                  <button id="halliExplainBtn" type="button" aria-pressed="false">Explain</button>
                </div>
              </div>
              <div class="row">
                <div data-halli-explain="turn">Current Turn: <span id="halliTurn">-</span></div>
                <div data-halli-explain="bell_ready">Bell Ready: <span id="halliBell">-</span></div>
                <div data-halli-explain="winner">Winner: <span id="halliWinner">-</span></div>
              </div>
              <div class="row hidden" aria-hidden="true">
                <div data-halli-explain="flip_countdown">Flip Countdown: <span id="halliFlipCountdown">-</span></div>
                <div data-halli-explain="ring_countdown">Ring Countdown: <span id="halliRingCountdown">-</span></div>
              </div>
              <div class="row">
                <div data-halli-explain="last_ring">Last Ring Result: <span id="halliLastRing">-</span></div>
                <div data-halli-explain="last_action">Last Action: <span id="halliLastAction">-</span></div>
              </div>

              <div class="hidden" aria-hidden="true">
                <h3>Actions</h3>
                <div class="row actions">
                  <button id="halliFlipBtn" data-halli-explain="flip">Flip</button>
                  <button id="halliRingBtn" data-halli-explain="ring">Ring Bell</button>
                </div>
              </div>

              <h3>Table</h3>
              <div id="halliTable" class="halli-table">
                <div id="halliPlayers" class="halli-players" data-halli-explain="players"></div>
                <div id="halliBellCenter" class="halli-bell-center" role="button" tabindex="0" aria-label="Ring Bell" data-halli-explain="bell">
                  <div class="halli-bell-emoji" aria-hidden="true">🔔</div>
                  <div id="halliBellCountdown" class="halli-bell-countdown hidden" aria-hidden="true">-</div>
                </div>
              </div>
            </template>
